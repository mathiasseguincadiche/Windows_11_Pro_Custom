add_newline = true
command_timeout = 800
scan_timeout = 30

format = "$username$hostname$directory$git_branch$git_status$kubernetes$aws$terraform$python$docker_context$cmd_duration$line_break$character"

[username]
show_always = false
style_user = "bold cyan"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold cyan"
format = "[@$hostname]($style) "

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[kubernetes]
disabled = false
symbol = "☸ "
style = "bold cyan"
format = "on [$symbol$context( \\($namespace\\))]($style) "

[aws]
symbol = "☁ "
style = "bold yellow"
format = "on [$symbol$profile]($style) "

[terraform]
symbol = "󱁢 "
style = "bold purple"
format = "via [$symbol$version]($style) "

[python]
symbol = " "
style = "bold yellow"
format = "via [$symbol$virtualenv]($style) "

[docker_context]
symbol = " "
style = "bold blue"
format = "via [$symbol$context]($style) "
only_with_files = true

[cmd_duration]
min_time = 1500
show_milliseconds = false
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
