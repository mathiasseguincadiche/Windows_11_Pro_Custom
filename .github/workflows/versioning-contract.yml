name: Versioning contract

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'scripts/core/runtime.psm1'
      - 'scripts/bootstrap/00_preflight.ps1'
      - 'scripts/bootstrap/00_storage_identity.ps1'
      - 'scripts/bootstrap/00_storage_integrity.ps1'
      - 'scripts/bootstrap/06_wsl.ps1'
      - 'config/orchestration/policy.json'
      - 'tests/powershell/versioning_contract.tests.ps1'
      - '.github/workflows/versioning-contract.yml'
      - '.github/workflows/storage-identity.yml'
      - '.github/workflows/storage-safety.yml'
      - '.github/workflows/menu-process-isolation.yml'
      - '.github/workflows/orchestration.yml'
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'scripts/core/runtime.psm1'
      - 'scripts/bootstrap/00_preflight.ps1'
      - 'scripts/bootstrap/00_storage_identity.ps1'
      - 'scripts/bootstrap/00_storage_integrity.ps1'
      - 'scripts/bootstrap/06_wsl.ps1'
      - 'config/orchestration/policy.json'
      - 'tests/powershell/versioning_contract.tests.ps1'
      - '.github/workflows/versioning-contract.yml'
      - '.github/workflows/storage-identity.yml'
      - '.github/workflows/storage-safety.yml'
      - '.github/workflows/menu-process-isolation.yml'
      - '.github/workflows/orchestration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Validate global release and schema separation
        shell: pwsh
        run: .\tests\powershell\versioning_contract.tests.ps1

  filenames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Reject legacy milestone names in canonical components
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/orchestration.yml \
            .github/workflows/storage-safety.yml \
            .github/workflows/storage-identity.yml \
            .github/workflows/menu-process-isolation.yml \
            scripts/bootstrap/00_storage_integrity.ps1 \
            scripts/bootstrap/00_storage_identity.ps1 \
            tests/powershell/storage_contract.tests.ps1 \
            tests/regression/menu_process_isolation.tests.ps1; do
            test -f "$path"
          done
          test ! -e .github/workflows/orchestration-v9.yml
          test ! -e .github/workflows/storage-safety-v24.yml
          test ! -e .github/workflows/storage-identity-v25.yml
          test ! -e .github/workflows/menu-process-isolation-v27.yml
          test ! -e tests/powershell/storage_v24_contract.tests.ps1
          test ! -e tests/regression/menu_process_isolation_v27.ps1
