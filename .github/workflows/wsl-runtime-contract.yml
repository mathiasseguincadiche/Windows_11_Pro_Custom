name: wsl-runtime-contract

on:
  push:
    branches: ['**']
    paths:
      - 'config/wsl/**'
      - 'config/devops/**'
      - 'scripts/bootstrap/02_physical_readiness.ps1'
      - 'scripts/bootstrap/06_wsl.ps1'
      - 'scripts/bootstrap/08_devops.ps1'
      - 'scripts/bootstrap/14_validate_wsl_v6.ps1'
      - 'scripts/wsl/install-devops.sh'
      - 'scripts/wsl/install-quality-tools.sh'
      - '.github/workflows/wsl-runtime-contract.yml'
  pull_request:
    paths:
      - 'config/wsl/**'
      - 'config/devops/**'
      - 'scripts/bootstrap/02_physical_readiness.ps1'
      - 'scripts/bootstrap/06_wsl.ps1'
      - 'scripts/bootstrap/08_devops.ps1'
      - 'scripts/bootstrap/14_validate_wsl_v6.ps1'
      - 'scripts/wsl/install-devops.sh'
      - 'scripts/wsl/install-quality-tools.sh'
      - '.github/workflows/wsl-runtime-contract.yml'

permissions:
  contents: read
  attestations: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Validate Ubuntu WSL contract
        shell: bash
        run: |
          set -euo pipefail
          contract='config/wsl/runtime-contract.json'
          jq -e '
            (.schemaVersion == "1.1") and
            (.distribution == "Ubuntu") and
            (.sourceDistribution == "Ubuntu-26.04") and
            (.expectedVersionId == "26.04") and
            (.expectedCodename == "resolute") and
            (.installLocation == "D:\\WSL\\Ubuntu-DevOps") and
            (.homeFilesystem == "ext4") and
            (.workingRoots == ["~/projects", "~/labs", "~/repositories"]) and
            (.forbiddenRoots == ["/mnt/c", "/mnt/d"])
          ' "$contract" >/dev/null

      - name: Validate deterministic WSL source wiring
        shell: bash
        run: |
          set -euo pipefail
          wsl='scripts/bootstrap/06_wsl.ps1'
          readiness='scripts/bootstrap/02_physical_readiness.ps1'
          grep -Fq 'config\wsl\runtime-contract.json' "$wsl"
          grep -Fq 'config\wsl\runtime-contract.json' scripts/bootstrap/14_validate_wsl_v6.ps1
          grep -Fq 'sourceDistribution' "$wsl"
          grep -Fq 'sourceDistribution' "$readiness"
          grep -Fq -- "--name \$Distribution" "$wsl"
          grep -Fq -- "--location \$InstallLocation" "$wsl"
          grep -Fq -- "--distribution \$sourceDistribution" "$wsl"
          grep -Fq 'expectedVersionId' "$wsl"
          grep -Fq 'expectedVersionId' scripts/bootstrap/14_validate_wsl_v6.ps1
          grep -Fq 'Aucune suppression automatique nʼest effectuée' "$wsl"
          if grep -RInE 'wsl(\.exe)?[[:space:]]+--unregister|Remove-Item.+Ubuntu-DevOps' scripts config; then
            echo 'Destructive WSL automation detected.' >&2
            exit 1
          fi

      - name: Enforce Docker session refresh before immediate revalidation
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/bootstrap/08_devops.ps1'
          install_line="$(grep -nF "LogIdentity 'scripts/wsl/install-devops.sh'" "$script" | head -n1 | cut -d: -f1)"
          restart_line="$(grep -nF 'Restart-WslSessionAfterDockerGroupChange' "$script" | tail -n1 | cut -d: -f1)"
          terminal_line="$(grep -nF "Write-Host '[3/4] Terminal Bash DevOps'" "$script" | head -n1 | cut -d: -f1)"
          grep -Fq "wsl.exe --terminate \$Distribution" "$script"
          grep -Fq "Command 'id -nG'" "$script" || grep -Fq -- "-Command 'id -nG'" "$script"
          grep -Fq 'docker info >/dev/null 2>&1' "$script"
          if [[ -z "$install_line" || -z "$restart_line" || -z "$terminal_line" || "$restart_line" -le "$install_line" || "$restart_line" -ge "$terminal_line" ]]; then
            echo 'Docker group-session refresh must happen after install-devops.sh and before terminal/Verify work.' >&2
            exit 1
          fi

  microsoft-wsl-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Verify Ubuntu 26.04 remains an explicit WSL source
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors -fsSL \
            https://raw.githubusercontent.com/microsoft/WSL/master/distributions/DistributionInfo.json \
            -o DistributionInfo.json
          source_name="$(jq -r '.ModernDistributions.Ubuntu[] | select(.Name == "Ubuntu-26.04") | .Name' DistributionInfo.json)"
          source_url="$(jq -r '.ModernDistributions.Ubuntu[] | select(.Name == "Ubuntu-26.04") | .Amd64Url.Url' DistributionInfo.json)"
          test "$source_name" = 'Ubuntu-26.04'
          echo "$source_url" | grep -F '/26.04/'
          curl --retry 3 --retry-all-errors -fsSI "$source_url" >/dev/null

  ubuntu-2604-devops-compatibility:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned

      - name: Validate Resolute package baseline
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          test "$VERSION_CODENAME" = resolute
          apt-get update
          apt-get install -y --no-install-recommends \
            sudo ca-certificates curl wget gnupg lsb-release unzip jq git openssh-client \
            rsync tar gzip python3 python3-pip python3-venv pipx shellcheck shfmt \
            ansible-core bash-completion yamllint
          ansible-playbook --version | head -n 1 | grep -F 'core 2.20.1'
          python3 --version

      - name: Validate Docker repository for Ubuntu 26.04
        shell: bash
        run: |
          set -euo pipefail
          install -m 0755 -d /etc/apt/keyrings
          curl --retry 5 --retry-all-errors -fsSL https://download.docker.com/linux/ubuntu/gpg \
            -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          cat >/etc/apt/sources.list.d/docker.sources <<'EOF'
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: resolute
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          apt-get update
          apt-cache policy docker-ce-cli | grep -F 'Candidate:' | grep -v '(none)'
          apt-get install -y --no-install-recommends docker-ce-cli docker-buildx-plugin docker-compose-plugin
          docker --version
          docker buildx version
          docker compose version

      - name: Validate GitHub CLI and Trivy repositories
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main' \
            >/etc/apt/sources.list.d/github-cli.list
          wget -qO- https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor >/usr/share/keyrings/trivy.gpg
          echo 'deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main' \
            >/etc/apt/sources.list.d/trivy.list
          apt-get update
          apt-get install -y --no-install-recommends gh trivy
          gh --version
          trivy --version

      - name: Validate pinned portable DevOps binaries on Ubuntu 26.04
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source config/devops/tool-versions.env
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          curl --retry 5 --retry-all-errors -fsSL \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o "$tmpdir/kubectl"
          kubectl_sha="$(curl --retry 5 --retry-all-errors -fsSL \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256")"
          echo "$kubectl_sha  $tmpdir/kubectl" | sha256sum -c -
          chmod +x "$tmpdir/kubectl"
          "$tmpdir/kubectl" version --client --output=json \
            | jq -e --arg expected "$KUBECTL_VERSION" '.clientVersion.gitVersion == $expected' >/dev/null

          helm_archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl --retry 5 --retry-all-errors -fsSL "https://get.helm.sh/${helm_archive}" -o "$tmpdir/$helm_archive"
          helm_sha="$(curl --retry 5 --retry-all-errors -fsSL "https://get.helm.sh/${helm_archive}.sha256sum" | awk '{print $1}')"
          echo "$helm_sha  $tmpdir/$helm_archive" | sha256sum -c -
          tar -xzf "$tmpdir/$helm_archive" -C "$tmpdir"
          "$tmpdir/linux-amd64/helm" version --short | grep -F "$HELM_VERSION"

          terraform_archive="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl --retry 5 --retry-all-errors -fsSL \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${terraform_archive}" \
            -o "$tmpdir/$terraform_archive"
          curl --retry 5 --retry-all-errors -fsSL \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_SHA256SUMS" \
            -o "$tmpdir/terraform_SHA256SUMS"
          (cd "$tmpdir" && grep " ${terraform_archive}$" terraform_SHA256SUMS | sha256sum -c - && unzip -qo "$terraform_archive")
          "$tmpdir/terraform" version -json | jq -e --arg expected "$TERRAFORM_VERSION" '.terraform_version == $expected' >/dev/null

          aws_archive="awscli-exe-linux-x86_64-${AWS_CLI_VERSION}.zip"
          curl --retry 5 --retry-all-errors -fsSL "https://awscli.amazonaws.com/${aws_archive}" -o "$tmpdir/aws.zip"
          unzip -q "$tmpdir/aws.zip" -d "$tmpdir/aws-cli"
          "$tmpdir/aws-cli/aws/install" --install-dir "$tmpdir/aws-install" --bin-dir "$tmpdir/aws-bin"
          "$tmpdir/aws-bin/aws" --version 2>&1 | grep -F "aws-cli/${AWS_CLI_VERSION}"

          minikube_url="https://storage.googleapis.com/minikube/releases/${MINIKUBE_VERSION}/minikube-linux-amd64"
          curl --retry 5 --retry-all-errors -fsSL "$minikube_url" -o "$tmpdir/minikube"
          minikube_sha="$(curl --retry 5 --retry-all-errors -fsSL "${minikube_url}.sha256")"
          echo "$minikube_sha  $tmpdir/minikube" | sha256sum -c -
          chmod +x "$tmpdir/minikube"
          "$tmpdir/minikube" version --short | grep -F "$MINIKUBE_VERSION"

          kind_url="https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl --retry 5 --retry-all-errors -fsSL "$kind_url" -o "$tmpdir/kind"
          curl --retry 5 --retry-all-errors -fsSL "${kind_url}.sha256sum" -o "$tmpdir/kind.sha256sum"
          (cd "$tmpdir" && cp kind kind-linux-amd64 && sha256sum -c kind.sha256sum)
          chmod +x "$tmpdir/kind"
          "$tmpdir/kind" version | grep -F "$KIND_VERSION"

      - name: Validate pinned IaC quality tools on Ubuntu 26.04
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home --shell /bin/bash ci-wsl
          echo 'ci-wsl ALL=(ALL) NOPASSWD:ALL' >/etc/sudoers.d/ci-wsl
          chmod 0440 /etc/sudoers.d/ci-wsl
          chown -R ci-wsl:ci-wsl "$GITHUB_WORKSPACE"
          sudo -u ci-wsl -H env GH_TOKEN="$GH_TOKEN" \
            bash -lc "cd '$GITHUB_WORKSPACE' && bash scripts/wsl/install-quality-tools.sh"
