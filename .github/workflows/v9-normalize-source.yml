name: V9 source normalization

on:
  push:
    branches: [feat/orchestration-idempotence-v9]
    paths:
      - '.github/workflows/v9-normalize-source.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/orchestration-idempotence-v9
          fetch-depth: 0

      - name: Normalize quote-like apostrophes in PowerShell source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = list(Path('.').rglob('*.ps1')) + list(Path('.').rglob('*.psm1'))
          changed = []
          for path in targets:
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              new = text.replace('\u2018', '\u02bc').replace('\u2019', '\u02bc')
              if new != text:
                  path.write_text(new, encoding='utf-8', newline='\n')
                  changed.append(str(path))
          print('Normalized files:')
          for item in changed:
              print(f'  {item}')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.ps1' '*.psm1'
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: normalize PowerShell apostrophes for parsing'
          git push origin HEAD:feat/orchestration-idempotence-v9
