name: Restore point CIM contract

on:
  pull_request:
    paths:
      - '.github/workflows/restore-point-exitcode.yml'
      - 'scripts/bootstrap/02_physical_readiness.ps1'
      - 'scripts/core/powershell-runtime.psm1'
      - 'scripts/windows/41_restore_point.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-point-exitcode.yml'
      - 'scripts/bootstrap/02_physical_readiness.ps1'
      - 'scripts/core/powershell-runtime.psm1'
      - 'scripts/windows/41_restore_point.ps1'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Enforce PowerShell 7 CIM restore-point contract
        shell: bash
        run: |
          set -euo pipefail
          readiness='scripts/bootstrap/02_physical_readiness.ps1'
          restore='scripts/windows/41_restore_point.ps1'
          grep -Fq "ClassName SystemRestore" "$readiness"
          grep -Fq "CreateRestorePoint" "$readiness"
          grep -Fq "MethodName 'Enable'" "$restore"
          grep -Fq "MethodName 'CreateRestorePoint'" "$restore"
          grep -Fq 'RestorePointType = [uint32]12' "$restore"
          grep -Fq 'EventType = [uint32]100' "$restore"
          grep -Fq 'Assert-WpcPowerShellRuntime' "$restore"
          grep -Fq 'CimClassMethods |' "$readiness" "$restore"
          grep -Fq 'ForEach-Object { [string]$_.Name }' "$readiness" "$restore"
          grep -Fq 'Release=$release' "$readiness"
          grep -Fq 'SchemaVersion=2' "$readiness"
          if grep -Fq 'CimClassMethods.Keys' "$restore" "$readiness" '.github/workflows/restore-point-exitcode.yml'; then
            echo 'CimClassMethods.Keys is invalid for CimReadOnlyKeyedCollection and is forbidden.' >&2
            exit 1
          fi
          if grep -Fq 'Checkpoint-Computer' "$restore" "$readiness"; then
            echo 'Checkpoint-Computer fallback is forbidden.' >&2
            exit 1
          fi

  windows-host-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Prove SystemRestore CIM provider when available from pwsh
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $class = Get-CimClass -Namespace 'root/default' -ClassName SystemRestore -ErrorAction Stop
          } catch {
            Write-Warning 'SystemRestore is not exposed by this hosted Windows Server runner; physical Windows 11 validation remains fail-closed.'
            return
          }
          $methods = @(
            $class.CimClassMethods |
              ForEach-Object { [string]$_.Name }
          )
          foreach ($required in @('Enable','CreateRestorePoint')) {
            if ($methods -notcontains $required) { throw "SystemRestore method unavailable: $required" }
          }
          Write-Host "SystemRestore methods: $($methods -join ', ')"
