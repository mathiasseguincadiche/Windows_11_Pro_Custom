name: Physical install V17

on:
  pull_request:
    paths:
      - '.github/workflows/physical-install-v17.yml'
      - 'install.ps1'
      - 'scripts/bootstrap/00_preflight.ps1'
      - 'scripts/bootstrap/02_physical_readiness.ps1'
      - 'scripts/bootstrap/06_wsl.ps1'
      - 'scripts/bootstrap/08_devops.ps1'
      - 'scripts/core/windows-native.psm1'
      - 'config/hardware/**'
      - 'config/wsl/**'
      - 'manifests/winget/apps-core.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/physical-install-v17.yml'
      - 'install.ps1'
      - 'scripts/bootstrap/00_preflight.ps1'
      - 'scripts/bootstrap/02_physical_readiness.ps1'
      - 'scripts/bootstrap/06_wsl.ps1'
      - 'scripts/bootstrap/08_devops.ps1'
      - 'scripts/core/windows-native.psm1'
      - 'config/hardware/**'
      - 'config/wsl/**'
      - 'manifests/winget/apps-core.json'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enforce fail-before-mutation physical readiness
        shell: bash
        run: |
          set -euo pipefail
          install='install.ps1'
          preflight='scripts/bootstrap/00_preflight.ps1'
          readiness='scripts/bootstrap/02_physical_readiness.ps1'

          test -f "$readiness"
          grep -Fq "02_physical_readiness.ps1" "$preflight"
          grep -Fq "& \$physicalReadinessScript -Strict:\$StrictPhysicalReadiness" "$preflight"
          grep -Fq "StrictPhysicalReadiness" "$install"
          grep -Fq "if (\$Mode -in @('Apply','Verify'))" "$install"
          grep -Fq "Ensure-HardwareManualEvidence" "$install"
          grep -Fq "avant toute convergence" "$install"
          grep -Fq -- "-not \$PlanOnly" "$install"
          grep -Fq "PowerShell 7 supporté" "$readiness"
          grep -Fq "7.4.0" "$readiness"
          grep -Fq "build -ge 22621" "$readiness"
          grep -Fq "Secure Boot actif" "$readiness"
          grep -Fq "TPM prêt" "$readiness"
          grep -Fq "Virtualisation firmware active" "$readiness"
          grep -Fq "Espace WSL sur D:" "$readiness"
          grep -Fq "Symbiose matériel/pilotes" "$readiness"
          grep -Fq "Microsoft-Windows-Subsystem-Linux" "$readiness"
          grep -Fq "VirtualMachinePlatform" "$readiness"
          grep -Fq "Garde-fou point de restauration disponible" "$readiness"
          grep -Fq "winget.exe show --id" "$readiness"
          grep -Fq "sourceDistribution" "$readiness"
          grep -Fq "VERDICT: PHYSICAL INSTALL READY" "$readiness"
          grep -Fq "aucune convergence ne doit commencer avant un verdict READY" "$readiness"

          forbidden='Format-Volume|Clear-Disk|Initialize-Disk|Remove-Partition|DisableRealtimeMonitoring|--unregister|Remove-AppxPackage'
          if grep -InE "$forbidden" "$readiness"; then
            echo 'Physical readiness must stay observation-only.' >&2
            exit 1
          fi

      - name: Enforce deterministic WSL and Docker first-run recovery
        shell: bash
        run: |
          set -euo pipefail
          contract='config/wsl/runtime-contract.json'
          wsl='scripts/bootstrap/06_wsl.ps1'
          devops='scripts/bootstrap/08_devops.ps1'

          jq -e '.sourceDistribution == "Ubuntu-26.04" and .distribution == "Ubuntu"' "$contract" >/dev/null
          grep -Fq -- "--distribution \$sourceDistribution --name \$Distribution --location \$InstallLocation --no-launch" "$wsl"
          grep -Fq "Aucune autre version Ubuntu ne sera substituée silencieusement" "$wsl"
          grep -Fq 'Restart-WslSessionAfterDockerGroupChange' "$devops"
          grep -Fq "wsl.exe --terminate \$Distribution" "$devops"
          grep -Fq -- "-Command 'id -nG'" "$devops"
          grep -Fq 'docker info >/dev/null 2>&1' "$devops"

  windows-host-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse physical installation PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.\install.ps1',
            '.\scripts\bootstrap\00_preflight.ps1',
            '.\scripts\bootstrap\02_physical_readiness.ps1',
            '.\scripts\bootstrap\06_wsl.ps1',
            '.\scripts\bootstrap\08_devops.ps1',
            '.\scripts\core\windows-native.psm1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw "$path parse errors: $($errors.Message -join '; ')" }
          }

      - name: Validate PowerShell Core and native host detection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -ne 'Core') { throw "Expected PowerShell Core, got $($PSVersionTable.PSEdition)" }
          if ([version]$PSVersionTable.PSVersion -lt [version]'7.4.0') { throw "PowerShell runner too old: $($PSVersionTable.PSVersion)" }
          Import-Module .\scripts\core\windows-native.psm1 -Force
          if (-not (Test-WpcWindowsHost)) { throw 'Windows runner was not detected as Windows.' }
          $hadOS = Test-Path Env:OS
          $originalOS = $env:OS
          try {
            Remove-Item Env:OS -ErrorAction SilentlyContinue
            if (-not (Test-WpcWindowsHost)) { throw 'Detection failed without env:OS.' }
            $env:OS = 'CORRUPTED_FOR_V17_TEST'
            if (-not (Test-WpcWindowsHost)) { throw 'Detection trusted corrupted env:OS.' }
          }
          finally {
            if ($hadOS) { $env:OS = $originalOS } else { Remove-Item Env:OS -ErrorAction SilentlyContinue }
          }

      - name: Validate Windows optional-feature inspection API
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Dism -ErrorAction Stop
          if (-not (Get-Command Get-WindowsOptionalFeature -ErrorAction SilentlyContinue)) {
            throw 'Get-WindowsOptionalFeature is unavailable after importing DISM.'
          }

      - name: Observe hosted-runner WSL CLI capabilities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wsl = Get-Command wsl.exe -ErrorAction Stop
          $help = (& $wsl.Source --help 2>&1 | Out-String)
          foreach ($option in @('--location','--name','--no-launch')) {
            $present = $help -match [regex]::Escape($option)
            Write-Host "Hosted runner capability $option = $present"
          }
          Write-Host 'The hosted Windows image is not treated as the Store WSL source of truth. scripts/bootstrap/02_physical_readiness.ps1 enforces these switches on the real workstation before mutation.'
