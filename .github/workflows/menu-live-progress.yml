name: Menu live progress

on:
  pull_request:
    paths:
      - 'menu.ps1'
      - '.github/workflows/menu-live-progress.yml'
  push:
    branches: [main]
    paths:
      - 'menu.ps1'
      - '.github/workflows/menu-live-progress.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Enforce live menu progress contract
        shell: bash
        run: |
          set -euo pipefail
          menu='menu.ps1'
          grep -Fq 'function Write-WpcLiveChildLine' "$menu"
          grep -Fq 'function Invoke-WpcVisibleChildProcess' "$menu"
          grep -Fq '@ArgumentList 2>&1 | ForEach-Object' "$menu"
          grep -Fq '$exitCode=Invoke-WpcVisibleChildProcess' "$menu"
          grep -Fq 'SUIVI EN DIRECT' "$menu"
          grep -Fq 'phases, sous-etapes, statuts et durees' "$menu"
          grep -Fq '[TERMINE] Action terminee | Duree:' "$menu"

  windows-stream-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Parse menu PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\menu.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if (@($errors).Count -gt 0) {
            throw "menu.ps1 parse errors: $($errors.Message -join '; ')"
          }

          foreach ($name in @('Write-WpcLiveChildLine','Invoke-WpcVisibleChildProcess')) {
            $functionAst = @($ast.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $name
            }, $true)) | Select-Object -First 1
            if (-not $functionAst) { throw "Missing function: $name" }
            Invoke-Expression $functionAst.Extent.Text
          }

          $child = Join-Path $env:RUNNER_TEMP 'wpc-live-child.ps1'
          @'
          Write-Output '[OK] stdout-test'
          [Console]::Error.WriteLine('[ERREUR] stderr-test')
          exit 23
          '@ | Set-Content -LiteralPath $child -Encoding UTF8

          $pwsh = (Get-Command pwsh.exe -CommandType Application).Source
          $exitCode = Invoke-WpcVisibleChildProcess -Executable $pwsh -ArgumentList @('-NoLogo','-NoProfile','-File',$child)
          if ($exitCode -ne 23) {
            throw "Live child process exit-code propagation failed: expected 23, got $exitCode"
          }
          Write-Host '[OK] Live stdout/stderr streaming preserves the native child exit code.'
