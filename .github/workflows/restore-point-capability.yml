name: Restore point capability

on:
  pull_request:
    paths:
      - '.github/workflows/restore-point-capability.yml'
      - 'scripts/core/powershell-runtime.psm1'
      - 'scripts/bootstrap/02_physical_readiness.ps1'
      - 'scripts/windows/41_restore_point.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-point-capability.yml'
      - 'scripts/core/powershell-runtime.psm1'
      - 'scripts/bootstrap/02_physical_readiness.ps1'
      - 'scripts/windows/41_restore_point.ps1'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Enforce PowerShell 7 SystemRestore capability contract
        shell: bash
        run: |
          set -euo pipefail
          readiness='scripts/bootstrap/02_physical_readiness.ps1'
          restore='scripts/windows/41_restore_point.ps1'
          grep -Fq "Get-CimClass -Namespace 'root/default' -ClassName SystemRestore" "$readiness"
          grep -Fq 'CreateRestorePoint' "$readiness"
          grep -Fq 'Invoke-CimMethod' "$restore"
          grep -Fq "ClassName 'SystemRestore'" "$restore"
          grep -Fq "MethodName 'CreateRestorePoint'" "$restore"
          grep -Fq 'PowerShell 7/CIM' "$restore"
          if grep -Fq 'Checkpoint-Computer' "$readiness" "$restore"; then
            echo 'Legacy Checkpoint-Computer dependency detected.' >&2
            exit 1
          fi

  windows-host-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned

      - name: Parse PowerShell 7 restore-point components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.\scripts\core\powershell-runtime.psm1',
            '.\scripts\bootstrap\02_physical_readiness.ps1',
            '.\scripts\windows\41_restore_point.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw "$path parse errors: $($errors.Message -join '; ')" }
          }

      - name: Prove SystemRestore API when hosted runner exposes it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $class = Get-CimClass -Namespace 'root/default' -ClassName SystemRestore -ErrorAction Stop
          } catch {
            Write-Warning 'SystemRestore is not exposed by this hosted Windows Server runner; physical Windows 11 validation remains fail-closed.'
            return
          }
          $methods = @($class.CimClassMethods.Keys)
          if ($methods -notcontains 'Enable') { throw 'SystemRestore.Enable is unavailable.' }
          if ($methods -notcontains 'CreateRestorePoint') { throw 'SystemRestore.CreateRestorePoint is unavailable.' }
