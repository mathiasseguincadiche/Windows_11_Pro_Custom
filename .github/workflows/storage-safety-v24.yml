name: Storage safety V24

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate V24 storage safety contract
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/bootstrap/00_storage_integrity_v24.ps1'
          preflight='scripts/bootstrap/00_preflight.ps1'

          test -f "$script"
          grep -Fq "Win32_Volume" "$script"
          grep -Fq "DirtyBitSet" "$script"
          grep -Fq "Repair-Volume -DriveLetter" "$script"
          grep -Fq -- "-Scan" "$script"
          grep -Fq "GetCorruptionCount" "$script"
          grep -Fq "fsutil.exe repair enumerate" "$script"
          grep -Fq "'$Corrupt'" "$script"
          grep -Fq "Get-StorageReliabilityCounter" "$script"
          grep -Fq "ReadErrorsTotal" "$script"
          grep -Fq "WriteErrorsTotal" "$script"
          grep -Fq "ReadErrorsUncorrected" "$script"
          grep -Fq "WriteErrorsUncorrected" "$script"
          grep -Fq "V24 STORAGE SAFETY BLOCK" "$script"
          grep -Fq "VERDICT: V24 STORAGE SAFETY READY" "$script"

          grep -Fq "00_storage_integrity_v24.ps1" "$preflight"
          grep -Fq '& $storageSafetyScript -Mode Verify' "$preflight"
          grep -Fq 'StrictPhysicalReadiness -or -not $AllowPendingReboot' "$preflight"
          grep -Fq 'ne contourne jamais StrictPhysicalReadiness' "$preflight"

          pending_line=$(grep -n 'if ($pendingReboot.Pending -and ($StrictPhysicalReadiness -or -not $AllowPendingReboot))' "$preflight" | head -1 | cut -d: -f1)
          storage_line=$(grep -n '& $storageSafetyScript -Mode Verify' "$preflight" | head -1 | cut -d: -f1)
          physical_line=$(grep -n '& $physicalReadinessScript -Strict:$StrictPhysicalReadiness' "$preflight" | head -1 | cut -d: -f1)
          test "$pending_line" -lt "$storage_line"
          test "$storage_line" -lt "$physical_line"

      - name: Reject destructive storage operations and bypasses
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/bootstrap/00_storage_integrity_v24.ps1'
          forbidden='Format-Volume|Clear-Disk|Initialize-Disk|Remove-Partition|Resize-Partition|Set-Partition|Repair-Volume.*-SpotFix|Repair-Volume.*-OfflineScanAndFix|fsutil\.exe[[:space:]]+dirty[[:space:]]+set|fsutil\.exe[[:space:]]+repair[[:space:]]+(set|initiate)|chkdsk(\.exe)?[[:space:]].*/[FfRrXx]'
          if grep -InE "$forbidden" "$script"; then
            echo 'V24 must remain detection-only: a destructive or repair operation was detected.' >&2
            exit 1
          fi
          if grep -InE 'AllowDirty|SkipNtfs|SkipStorage|AllowStorage|IgnoreStorage|ForceStorage' "$script"; then
            echo 'V24 storage gate must not expose a convergence bypass.' >&2
            exit 1
          fi

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse V24 and preflight PowerShell
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @('.\scripts\bootstrap\00_storage_integrity_v24.ps1', '.\scripts\bootstrap\00_preflight.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            foreach ($parseError in @($errors)) {
              $failed = $true
              Write-Host "::error file=$path,line=$($parseError.Extent.StartLineNumber),col=$($parseError.Extent.StartColumnNumber)::$($parseError.Message)"
            }
          }
          if ($failed) { exit 1 }

      - name: Verify Windows APIs required by V24 exist
        shell: pwsh
        run: |
          $commands = @('Repair-Volume', 'Get-PhysicalDisk', 'Get-StorageReliabilityCounter', 'Get-CimInstance', 'Invoke-CimMethod')
          foreach ($command in $commands) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Required Windows API/cmdlet missing on runner: $command"
            }
          }
          $volumeClass = Get-CimClass -ClassName Win32_Volume -ErrorAction Stop
          if (-not ($volumeClass.CimClassProperties.Name -contains 'DirtyBitSet')) {
            throw 'Win32_Volume.DirtyBitSet is unavailable.'
          }
          $msftVolumeClass = Get-CimClass -Namespace 'root/Microsoft/Windows/Storage' -ClassName MSFT_Volume -ErrorAction Stop
          if (-not ($msftVolumeClass.CimClassMethods.Name -contains 'GetCorruptionCount')) {
            throw 'MSFT_Volume.GetCorruptionCount is unavailable.'
          }
