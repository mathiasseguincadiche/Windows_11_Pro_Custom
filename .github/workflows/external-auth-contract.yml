name: External auth contract

on:
  pull_request:
    paths:
      - 'menu.ps1'
      - 'scripts/bootstrap/15_external_auth.ps1'
      - 'scripts/bootstrap/16_external_auth_interactive.ps1'
      - 'docs/07_DEVOPS_STACK.md'
      - '.github/workflows/external-auth-contract.yml'
  push:
    branches: [main]
    paths:
      - 'menu.ps1'
      - 'scripts/bootstrap/15_external_auth.ps1'
      - 'scripts/bootstrap/16_external_auth_interactive.ps1'
      - 'docs/07_DEVOPS_STACK.md'
      - '.github/workflows/external-auth-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.\menu.ps1',
            '.\scripts\bootstrap\15_external_auth.ps1',
            '.\scripts\bootstrap\16_external_auth_interactive.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            )
            if (@($errors).Count -gt 0) {
              throw "$path parse errors: $($errors.Message -join '; ')"
            }
          }

      - name: Enforce direct interactive boundary and login-first AWS UX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $menu = Get-Content -Raw '.\menu.ps1'
          $interactive = Get-Content -Raw '.\scripts\bootstrap\16_external_auth_interactive.ps1'
          $audit = Get-Content -Raw '.\scripts\bootstrap\15_external_auth.ps1'

          foreach ($needle in @(
            'Invoke-WpcInteractiveRepoScript',
            '16_external_auth_interactive.ps1',
            '15_external_auth.ps1',
            'Connexions externes'
          )) {
            if (-not $menu.Contains($needle)) { throw "menu.ps1 missing external auth wiring: $needle" }
          }

          foreach ($needle in @(
            "'gh','auth','login'",
            "'--web'",
            "'gh','auth','logout'",
            'Get-GitHubCredentialStorage',
            'Resolve-GitHubPlaintextFallback',
            'PlaintextFile',
            'hosts.yml',
            'chmod 600',
            'Read-YesNoLoop',
            'Veux-tu configurer AWS maintenant',
            'CONNEXION AWS CONSOLE PAR NAVIGATEUR — RECOMMANDÉE',
            'PROFIL AWS CLI LOCAL',
            'Ce n est PAS le nom d un projet AWS',
            'Utiliser le profil local recommandé "default"',
            'Profil AWS CLI local sélectionné',
            'Test-AwsLoginSupported',
            "[version]'2.32.0'",
            "'aws','login','--profile'",
            'login_session',
            'sso_session',
            'Get-AwsProfileAuthMode',
            'IAM IDENTITY CENTER / SSO',
            'Start URL/Issuer URL',
            "'aws','configure','sso'",
            "'aws','sso','login','--profile'",
            'ACCESS KEY / SECRET KEY — LEGACY',
            "'aws','configure','--profile'",
            '~/.aws/login/cache',
            '~/.aws/credentials',
            'Read-AwsMethodChoice',
            'Get-AwsMethodPrompt',
            'Read-Host (Get-AwsMethodPrompt)',
            'Choix [0-4]',
            'Choix invalide. Entre 0, 1, 2, 3 ou 4.',
            '[IGNORE] AWS non configuré pour le moment.',
            '[RETOUR] Configuration AWS quittée sans erreur.'
          )) {
            if (-not $interactive.Contains($needle)) { throw "interactive auth contract missing: $needle" }
          }

          if ($interactive -match 'IAM Identity Center / SSO — RECOMMANDÉ') {
            throw 'IAM Identity Center must not be presented as the universal recommended path.'
          }
          if ($interactive -match "Read-AwsProfileName[\s\S]*IsNullOrWhiteSpace\(\$value\)[\s\S]*return 'default'") {
            throw 'AWS profile selection must not silently convert an empty prompt into default; the user must explicitly choose default.'
          }
          if ($interactive -notmatch "Read-AwsProfileName[\s\S]*Read-YesNoLoop[\s\S]*profil local recommandé.*default") {
            throw 'AWS default profile selection must be explicit and visible before aws login.'
          }
          if ($interactive -notmatch "'1'\s*\{[\s\S]*'aws','login','--profile'") {
            throw 'AWS option 1 must execute aws login with a named/default profile.'
          }
          if ($interactive -notmatch "'2'\s*\{[\s\S]*'aws','configure','sso'") {
            throw 'AWS option 2 must be the IAM Identity Center configuration path.'
          }
          if ($interactive -notmatch "'3'\s*\{[\s\S]*Get-AwsProfileAuthMode") {
            throw 'AWS option 3 must detect the existing profile authentication mode.'
          }
          if ($interactive -notmatch "'4'\s*\{[\s\S]*'aws','configure','--profile'") {
            throw 'AWS option 4 must remain the explicit legacy static-key path.'
          }
          if ($interactive -match 'default\s*\{\s*throw\s+.*Choix AWS') {
            throw 'Invalid AWS menu input must re-display the menu instead of terminating the assistant.'
          }
          if ($interactive -notmatch 'function\s+Read-AwsMethodChoice[\s\S]*while\s*\(\$true\)[\s\S]*Read-Host\s+\(Get-AwsMethodPrompt\)') {
            throw 'AWS choices and explanations must remain embedded in the visible Read-Host prompt.'
          }
          if ($interactive -notmatch 'while\s*\(\$true\)[\s\S]*Réponse invalide\. Entre O pour oui ou N pour non') {
            throw 'O/N prompts must retry on empty or invalid input.'
          }

          if ($interactive -match 'Invoke-WpcExternalCommand|Tee-Object|Start-Transcript') {
            throw 'Interactive authentication must never traverse the managed logger/transcript pipeline.'
          }
          if ($menu -notmatch '&\s*\$exe\s+@childArgs') {
            throw 'Interactive menu helper must invoke the child directly instead of the captured live relay.'
          }
          if ($menu -match 'Invoke-WpcVisibleChildProcess[^\r\n]*ExternalAuthInteractive') {
            throw 'Interactive auth must not use the captured child-process relay.'
          }

          foreach ($needle in @(
            'SecretMaterialRecorded = $false',
            "'gh','auth','status'",
            'CredentialStorage',
            'PlaintextCredentialDetected',
            'SecureEnoughForRequiredVerify',
            "'aws','configure','list-profiles'",
            "'aws','sts','get-caller-identity'"
          )) {
            if (-not $audit.Contains($needle)) { throw "non-secret audit contract missing: $needle" }
          }

      - name: Reject credential persistence and insecure-storage patterns
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            '.\menu.ps1',
            '.\scripts\bootstrap\15_external_auth.ps1',
            '.\scripts\bootstrap\16_external_auth_interactive.ps1'
          )
          $combined = ($paths | ForEach-Object { Get-Content -Raw $_ }) -join "`n"
          $forbidden = @(
            '--with-token',
            '--insecure-storage',
            'AWS_SECRET_ACCESS_KEY=',
            'AWS_ACCESS_KEY_ID=',
            'GH_TOKEN=',
            'GITHUB_TOKEN=',
            'Set-Content.*credentials',
            'Add-Content.*credentials',
            'ConvertFrom-SecureString',
            'Export-Clixml',
            'Get-Content.*hosts\.yml'
          )
          foreach ($pattern in $forbidden) {
            if ($combined -match $pattern) { throw "Forbidden credential persistence/injection pattern: $pattern" }
          }

      - name: Require metadata-only plaintext detection
        shell: pwsh
        run: |
          $interactive = Get-Content -Raw '.\scripts\bootstrap\16_external_auth_interactive.ps1'
          $audit = Get-Content -Raw '.\scripts\bootstrap\15_external_auth.ps1'
          foreach ($text in @($interactive, $audit)) {
            if ($text -notmatch 'grep -Eq .*oauth_token') {
              throw 'GitHub plaintext detection must inspect only the presence of the oauth_token key.'
            }
          }
          if ($audit -match 'gh\s+auth\s+token|--show-token') {
            throw 'Audit must never request the GitHub token value.'
          }

      - name: Dry-run external auth menu entries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($choice in @('8.8','8.9')) {
            $output = & pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\menu.ps1 -Choice $choice -DryRun -NoClear -NoPause 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "menu choice $choice failed: $output" }
            if ($output -notmatch '\[DRY-RUN\]') { throw "menu choice $choice was not non-mutating in DryRun." }
          }
