name: External auth contract

on:
  pull_request:
    paths:
      - 'menu.ps1'
      - 'scripts/bootstrap/15_external_auth.ps1'
      - 'scripts/bootstrap/16_external_auth_interactive.ps1'
      - 'docs/08_EXTERNAL_AUTH.md'
      - '.github/workflows/external-auth-contract.yml'
  push:
    branches: [main]
    paths:
      - 'menu.ps1'
      - 'scripts/bootstrap/15_external_auth.ps1'
      - 'scripts/bootstrap/16_external_auth_interactive.ps1'
      - 'docs/08_EXTERNAL_AUTH.md'
      - '.github/workflows/external-auth-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.\menu.ps1',
            '.\scripts\bootstrap\15_external_auth.ps1',
            '.\scripts\bootstrap\16_external_auth_interactive.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            )
            if (@($errors).Count -gt 0) {
              throw "$path parse errors: $($errors.Message -join '; ')"
            }
          }

      - name: Enforce real-terminal authentication boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $menu = Get-Content -Raw '.\menu.ps1'
          $interactive = Get-Content -Raw '.\scripts\bootstrap\16_external_auth_interactive.ps1'
          $audit = Get-Content -Raw '.\scripts\bootstrap\15_external_auth.ps1'

          foreach ($needle in @(
            'Invoke-WpcInteractiveRepoScript',
            '16_external_auth_interactive.ps1',
            'Connexions externes'
          )) {
            if (-not $menu.Contains($needle)) { throw "menu wiring missing: $needle" }
          }

          foreach ($needle in @(
            'Invoke-WslTerminalInteractive',
            'wt.exe',
            "'new-tab'",
            "'wsl.exe'",
            "'--exec'",
            'Quand la commande dans le nouvel onglet est terminée',
            'Configure-GitHub',
            "'gh','auth','login'",
            'Resolve-GitHubPlaintextFallback',
            'chmod 700',
            'chmod 600',
            '.wpc-plaintext-accepted',
            'Invoke-AwsRemoteLoginTerminal',
            "'aws','login','--remote'",
            "'--region'",
            "'--no-cli-auto-prompt'",
            'Invoke-AwsSsoLoginTerminal',
            "'aws','sso','login'",
            "'--no-browser'",
            "'--use-device-code'",
            "'aws','configure','sso'",
            "'aws','configure','--profile'",
            "'aws','sts','get-caller-identity'",
            'SignInLocalDevelopmentAccess'
          )) {
            if (-not $interactive.Contains($needle)) { throw "interactive auth contract missing: $needle" }
          }

          if ($interactive -match "Invoke-WslSimple[\s\S]{0,240}'aws','login','--remote'") {
            throw 'aws login --remote must never run through the parent wsl.exe stdin path.'
          }
          if ($interactive -match "Invoke-WslSimple[\s\S]{0,240}'aws','configure','sso'") {
            throw 'interactive aws configure sso must run in a dedicated terminal.'
          }
          if ($interactive -match "Invoke-WslSimple[\s\S]{0,240}'gh','auth','login'") {
            throw 'interactive gh auth login must run in a dedicated terminal.'
          }
          if ($interactive -notmatch "function\s+Invoke-AwsRemoteLoginTerminal[\s\S]*Invoke-WslTerminalInteractive") {
            throw 'AWS login helper must cross the Windows Terminal boundary.'
          }
          if ($interactive -notmatch "function\s+Invoke-AwsSsoLoginTerminal[\s\S]*Invoke-WslTerminalInteractive") {
            throw 'AWS SSO helper must cross the Windows Terminal boundary.'
          }

          foreach ($needle in @(
            'SecretMaterialRecorded = $false',
            'CredentialStorage',
            'PlaintextCredentialDetected',
            'PlaintextPermissionsProtected',
            'PlaintextFallbackExplicitlyAccepted',
            'SecureEnoughForRequiredVerify'
          )) {
            if (-not $audit.Contains($needle)) { throw "non-secret audit contract missing: $needle" }
          }

      - name: Reject secret extraction and persistence
        shell: pwsh
        run: |
          $combined = ((Get-Content -Raw '.\scripts\bootstrap\15_external_auth.ps1'), (Get-Content -Raw '.\scripts\bootstrap\16_external_auth_interactive.ps1')) -join "`n"
          foreach ($pattern in @(
            '--with-token',
            '--insecure-storage',
            'gh\s+auth\s+token',
            '--show-token',
            'AWS_SECRET_ACCESS_KEY=',
            'AWS_ACCESS_KEY_ID=',
            'GH_TOKEN=',
            'GITHUB_TOKEN=',
            'ConvertFrom-SecureString',
            'Export-Clixml',
            'Start-Transcript',
            'Tee-Object'
          )) {
            if ($combined -match $pattern) { throw "Forbidden auth pattern: $pattern" }
          }

      - name: Require metadata-only GitHub token detection
        shell: pwsh
        run: |
          foreach ($path in @('.\scripts\bootstrap\15_external_auth.ps1','.\scripts\bootstrap\16_external_auth_interactive.ps1')) {
            $text = Get-Content -Raw $path
            if ($text -notmatch 'grep -Eq .*oauth_token') {
              throw "$path must inspect only oauth_token key presence."
            }
          }

      - name: Dry-run external auth menu entries
        shell: pwsh
        run: |
          foreach ($choice in @('8.8','8.9')) {
            $output = & pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\menu.ps1 -Choice $choice -DryRun -NoClear -NoPause 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "menu choice $choice failed: $output" }
            if ($output -notmatch '\[DRY-RUN\]') { throw "menu choice $choice was not non-mutating in DryRun." }
          }
