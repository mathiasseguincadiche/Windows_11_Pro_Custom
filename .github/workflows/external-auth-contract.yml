name: External auth contract

on:
  pull_request:
    paths:
      - 'menu.ps1'
      - 'scripts/core/powershell-runtime.psm1'
      - 'scripts/bootstrap/15_external_auth.ps1'
      - 'scripts/bootstrap/16_external_auth_interactive.ps1'
      - 'docs/08_EXTERNAL_AUTH.md'
      - '.github/workflows/external-auth-contract.yml'
  push:
    branches: [main]
    paths:
      - 'menu.ps1'
      - 'scripts/core/powershell-runtime.psm1'
      - 'scripts/bootstrap/15_external_auth.ps1'
      - 'scripts/bootstrap/16_external_auth_interactive.ps1'
      - 'docs/08_EXTERNAL_AUTH.md'
      - '.github/workflows/external-auth-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('.\menu.ps1','.\scripts\core\powershell-runtime.psm1','.\scripts\bootstrap\15_external_auth.ps1','.\scripts\bootstrap\16_external_auth_interactive.ps1')) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if (@($errors).Count -gt 0) { throw "$path parse errors: $($errors.Message -join '; ')" }
          }

      - name: Enforce interactive authentication boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Resolve-Path '.\scripts\bootstrap\16_external_auth_interactive.ps1'
          $text = Get-Content -Raw $path
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          function Fn([string]$name) {
            $node = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $name },$true)
            if (-not $node) { throw "missing function: $name" }
            $node.Extent.Text
          }
          $github = Fn 'Configure-GitHub'
          $inline = Fn 'Invoke-WslInlineInteractive'
          $bridge = Fn 'Ensure-AwsWindowsBrowserBridge'
          $login = Fn 'Invoke-AwsSameDeviceLoginInline'
          $aws = Fn 'Configure-Aws'

          if (-not $github.Contains('Invoke-WslTerminalInteractive')) { throw 'GitHub login must keep its dedicated terminal boundary.' }
          if (-not $inline.Contains('& wsl.exe --distribution $Distribution --user $LinuxUser --exec @ArgumentList')) { throw 'AWS inline helper must inherit the current console.' }
          if ($inline -match 'Start-Process|Tee-Object|Out-String') { throw 'AWS inline helper must not detach or capture the native process.' }
          if (-not $bridge.Contains('command -v explorer.exe')) { throw 'AWS browser bridge must preflight explorer.exe interop.' }
          if (-not $bridge.Contains('exec explorer.exe "$1"')) { throw 'AWS browser bridge must pass the complete OAuth URL as one argument.' }
          if ($bridge.Contains('cmd.exe /d /c start') -or $text.Contains('exec cmd.exe /d /c start')) { throw 'OAuth URLs must never pass through cmd.exe command parsing.' }
          if (-not $bridge.Contains('chmod 700')) { throw 'AWS browser bridge must remain owner-executable only.' }
          if (-not $login.Contains('"BROWSER=$browserBridge"')) { throw 'AWS login must use the managed browser bridge.' }
          if (-not $login.Contains("'aws','login','--profile'")) { throw 'AWS same-device login command missing.' }
          if ($login.Contains("'--remote'") -or $text.Contains("'aws','login','--remote'")) { throw 'aws login --remote is forbidden on this workstation.' }
          if ($aws.Contains('Invoke-WslTerminalInteractive')) { throw 'AWS interactive flows must stay in the current terminal.' }
          foreach ($needle in @("'aws','configure','sso'","'aws','configure','--profile'","'aws','sts','get-caller-identity'")) {
            if (-not $text.Contains($needle)) { throw "AWS contract missing: $needle" }
          }

      - name: Reject AWS stderr as configuration data
        shell: pwsh
        run: |
          $text = Get-Content -Raw '.\scripts\bootstrap\16_external_auth_interactive.ps1'
          foreach ($needle in @('function Get-AwsConfigValue',"if (`$probe.ExitCode -ne 0) { return '' }","Get-AwsConfigValue -Profile `$Profile -Name 'region'","Get-AwsConfigValue -Profile `$Profile -Name 'login_session'","Get-AwsConfigValue -Profile `$Profile -Name 'sso_session'","Get-AwsConfigValue -Profile `$Profile -Name 'sso_start_url'",'function Test-AwsRegionName','Région AWS refusée avant lancement')) {
            if (-not $text.Contains($needle)) { throw "AWS config safety contract missing: $needle" }
          }
          if (([regex]::Matches($text,"'aws','configure','get'")).Count -ne 1) { throw 'All AWS config reads must go through Get-AwsConfigValue.' }

      - name: Reject credential extraction and persistence
        shell: pwsh
        run: |
          $combined = ((Get-Content -Raw '.\scripts\bootstrap\15_external_auth.ps1'),(Get-Content -Raw '.\scripts\bootstrap\16_external_auth_interactive.ps1')) -join "`n"
          foreach ($pattern in @('--with-token','--insecure-storage','gh\s+auth\s+token','--show-token','SECRET_ACCESS_KEY=','ACCESS_KEY_ID=','GH_TOKEN=','GITHUB_TOKEN=','ConvertFrom-SecureString','Export-Clixml','Start-Transcript','Tee-Object')) {
            if ($combined -match $pattern) { throw "Forbidden auth pattern: $pattern" }
          }

      - name: Require metadata-only GitHub token detection
        shell: pwsh
        run: |
          foreach ($path in @('.\scripts\bootstrap\15_external_auth.ps1','.\scripts\bootstrap\16_external_auth_interactive.ps1')) {
            if ((Get-Content -Raw $path) -notmatch 'grep -Eq .*oauth_token') { throw "$path must inspect only oauth_token key presence." }
          }

      - name: Dry-run external auth menu entries
        shell: pwsh
        run: |
          foreach ($choice in @('8.8','8.9')) {
            $output = & pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\menu.ps1 -Choice $choice -DryRun -NoClear -NoPause 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "menu choice $choice failed: $output" }
            if ($output -notmatch '\[DRY-RUN\]') { throw "menu choice $choice was not non-mutating in DryRun." }
          }
