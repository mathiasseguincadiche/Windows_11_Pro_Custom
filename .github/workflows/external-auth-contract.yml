name: External auth contract

on:
  pull_request:
    paths:
      - 'menu.ps1'
      - 'scripts/core/powershell-runtime.psm1'
      - 'scripts/bootstrap/15_external_auth.ps1'
      - 'scripts/bootstrap/16_external_auth_interactive.ps1'
      - 'docs/08_EXTERNAL_AUTH.md'
      - '.github/workflows/external-auth-contract.yml'
  push:
    branches: [main]
    paths:
      - 'menu.ps1'
      - 'scripts/core/powershell-runtime.psm1'
      - 'scripts/bootstrap/15_external_auth.ps1'
      - 'scripts/bootstrap/16_external_auth_interactive.ps1'
      - 'docs/08_EXTERNAL_AUTH.md'
      - '.github/workflows/external-auth-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned

      - name: Parse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.\menu.ps1',
            '.\scripts\core\powershell-runtime.psm1',
            '.\scripts\bootstrap\15_external_auth.ps1',
            '.\scripts\bootstrap\16_external_auth_interactive.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if (@($errors).Count -gt 0) { throw "$path parse errors: $($errors.Message -join '; ')" }
          }

      - name: Enforce safe interactive authentication boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $menu = Get-Content -Raw '.\menu.ps1'
          $interactivePath = Resolve-Path '.\scripts\bootstrap\16_external_auth_interactive.ps1'
          $interactive = Get-Content -Raw $interactivePath
          $audit = Get-Content -Raw '.\scripts\bootstrap\15_external_auth.ps1'

          foreach ($needle in @('Invoke-WpcInteractiveRepoScript','16_external_auth_interactive.ps1','Connexions externes')) {
            if (-not $menu.Contains($needle)) { throw "menu wiring missing: $needle" }
          }

          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($interactivePath,[ref]$tokens,[ref]$errors)
          if (@($errors).Count -gt 0) { throw "interactive auth parse errors: $($errors.Message -join '; ')" }
          function Get-FunctionText([string]$Name) {
            $node = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq $Name }, $true)
            if (-not $node) { throw "missing function: $Name" }
            return $node.Extent.Text
          }

          $dedicated = Get-FunctionText 'Invoke-WslTerminalInteractive'
          $inline = Get-FunctionText 'Invoke-WslInlineInteractive'
          $github = Get-FunctionText 'Configure-GitHub'
          $awsRemote = Get-FunctionText 'Invoke-AwsRemoteLoginInline'
          $awsSso = Get-FunctionText 'Invoke-AwsSsoLoginInline'
          $awsConfigure = Get-FunctionText 'Configure-Aws'

          foreach ($needle in @('wt.exe',"'new-tab'",'Quand la commande dans le nouvel onglet est terminée')) {
            if (-not $dedicated.Contains($needle)) { throw "GitHub dedicated-terminal contract missing: $needle" }
          }
          if (-not $github.Contains('Invoke-WslTerminalInteractive')) { throw 'GitHub login must keep its dedicated terminal boundary.' }
          if (-not $github.Contains("'gh','auth','login'")) { throw 'GitHub auth login command missing.' }

          foreach ($needle in @(
            'Invoke-WslInlineInteractive',
            '& wsl.exe --distribution $Distribution --user $LinuxUser --exec @ArgumentList',
            'stdin, stdout et stderr restent attachés au terminal courant',
            'Invoke-AwsRemoteLoginInline',
            "'aws','login','--remote'",
            "'--region'",
            "'--no-cli-auto-prompt'",
            'Invoke-AwsSsoLoginInline',
            "'aws','sso','login'",
            "'--no-browser'",
            "'--use-device-code'",
            "'aws','configure','sso'",
            "'aws','configure','--profile'",
            "'aws','sts','get-caller-identity'",
            'SignInLocalDevelopmentAccess',
            'Assert-WpcPowerShellRuntime'
          )) {
            if (-not $interactive.Contains($needle)) { throw "interactive auth contract missing: $needle" }
          }

          if ($inline.Contains('2>&1')) { throw 'Inline AWS terminal helper must not merge or capture stderr.' }
          if ($inline -match '\$output\s*=|Out-String|Tee-Object|Start-Process') { throw 'Inline AWS terminal helper must not capture or detach the native process.' }

          foreach ($pair in @(
            @{ Name='AWS remote login'; Text=$awsRemote },
            @{ Name='AWS SSO login'; Text=$awsSso }
          )) {
            if (-not $pair.Text.Contains('Invoke-WslInlineInteractive')) { throw "$($pair.Name) must run inline in the current terminal." }
            if ($pair.Text.Contains('Invoke-WslTerminalInteractive')) { throw "$($pair.Name) must never open a second terminal." }
          }

          if ($awsConfigure.Contains('Invoke-WslTerminalInteractive')) { throw 'All AWS interactive flows must remain in the current terminal.' }
          if (-not $awsConfigure.Contains("Invoke-WslInlineInteractive -Label 'AWS SSO configuration'")) { throw 'AWS SSO configuration must run inline.' }
          if (-not $awsConfigure.Contains('Invoke-WslInlineInteractive -Label "AWS configure | profil $profile"')) { throw 'Legacy AWS configure must run inline.' }
          if ($awsConfigure.Contains('nouvel onglet')) { throw 'AWS UX must not instruct the user to switch to another terminal.' }

          if ($interactive -match "Invoke-WslSimple[\s\S]{0,240}'aws','login','--remote'") { throw 'aws login --remote must never run through the captured WSL helper.' }
          if ($interactive -match "Invoke-WslSimple[\s\S]{0,240}'aws','configure','sso'") { throw 'interactive aws configure sso must never run through the captured WSL helper.' }
          if ($interactive -match "Invoke-WslSimple[\s\S]{0,240}'gh','auth','login'") { throw 'interactive gh auth login must run in a dedicated terminal.' }

          foreach ($needle in @(
            'SecretMaterialRecorded = $false',
            'CredentialStorage',
            'PlaintextCredentialDetected',
            'PlaintextPermissionsProtected',
            'PlaintextFallbackExplicitlyAccepted',
            'SecureEnoughForRequiredVerify'
          )) {
            if (-not $audit.Contains($needle)) { throw "non-secret audit contract missing: $needle" }
          }

      - name: Reject AWS stderr as configuration data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $interactive = Get-Content -Raw '.\scripts\bootstrap\16_external_auth_interactive.ps1'

          foreach ($needle in @(
            'function Get-AwsConfigValue',
            "if (`$probe.ExitCode -ne 0) { return '' }",
            "Get-AwsConfigValue -Profile `$Profile -Name 'region'",
            "Get-AwsConfigValue -Profile `$Profile -Name 'login_session'",
            "Get-AwsConfigValue -Profile `$Profile -Name 'sso_session'",
            "Get-AwsConfigValue -Profile `$Profile -Name 'sso_start_url'",
            'function Test-AwsRegionName',
            'Région AWS refusée avant lancement'
          )) {
            if (-not $interactive.Contains($needle)) { throw "AWS config safety contract missing: $needle" }
          }

          $configureGetCount = ([regex]::Matches($interactive, "'aws','configure','get'")).Count
          if ($configureGetCount -ne 1) {
            throw "All aws configure get calls must go through Get-AwsConfigValue; found $configureGetCount direct construction(s)."
          }

          if ($interactive -match "Resolve-AwsRegion[\s\S]{0,500}\(Invoke-WslSimple[\s\S]{0,200}'aws','configure','get'") {
            throw 'Resolve-AwsRegion must never consume Invoke-WslSimple output directly.'
          }

      - name: Reject secret extraction and persistence
        shell: pwsh
        run: |
          $combined = ((Get-Content -Raw '.\scripts\bootstrap\15_external_auth.ps1'), (Get-Content -Raw '.\scripts\bootstrap\16_external_auth_interactive.ps1')) -join "`n"
          foreach ($pattern in @(
            '--with-token','--insecure-storage','gh\s+auth\s+token','--show-token',
            'AWS_SECRET_ACCESS_KEY=','AWS_ACCESS_KEY_ID=','GH_TOKEN=','GITHUB_TOKEN=',
            'ConvertFrom-SecureString','Export-Clixml','Start-Transcript','Tee-Object'
          )) {
            if ($combined -match $pattern) { throw "Forbidden auth pattern: $pattern" }
          }

      - name: Require metadata-only GitHub token detection
        shell: pwsh
        run: |
          foreach ($path in @('.\scripts\bootstrap\15_external_auth.ps1','.\scripts\bootstrap\16_external_auth_interactive.ps1')) {
            $text = Get-Content -Raw $path
            if ($text -notmatch 'grep -Eq .*oauth_token') { throw "$path must inspect only oauth_token key presence." }
          }

      - name: Dry-run external auth menu entries
        shell: pwsh
        run: |
          foreach ($choice in @('8.8','8.9')) {
            $output = & pwsh.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\menu.ps1 -Choice $choice -DryRun -NoClear -NoPause 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "menu choice $choice failed: $output" }
            if ($output -notmatch '\[DRY-RUN\]') { throw "menu choice $choice was not non-mutating in DryRun." }
          }
