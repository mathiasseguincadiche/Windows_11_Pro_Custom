name: DevOps terminal

on:
  push:
    paths:
      - 'config/windows-terminal/**'
      - 'config/vscode/**'
      - 'config/wsl/bashrc.d/**'
      - 'config/wsl/starship.toml'
      - 'scripts/core/windows-terminal-settings.psm1'
      - 'scripts/core/windows-terminal-system.psm1'
      - 'scripts/wsl/manage-shell-profile.sh'
      - 'scripts/wsl/manage-devops-terminal.sh'
      - 'scripts/wsl/validate-devops-terminal.sh'
      - 'scripts/bootstrap/08_devops.ps1'
      - 'scripts/bootstrap/09_validate_devops.ps1'
      - 'scripts/bootstrap/10_workstation.ps1'
      - 'scripts/bootstrap/11_validate_windows.ps1'
      - 'scripts/windows/31_windows_terminal.ps1'
      - 'scripts/windows/31_windows_terminal_modern.ps1'
      - 'manifests/winget/apps-core.json'
      - '.github/workflows/devops-terminal.yml'
  pull_request:
    paths:
      - 'config/windows-terminal/**'
      - 'config/vscode/**'
      - 'config/wsl/bashrc.d/**'
      - 'config/wsl/starship.toml'
      - 'scripts/core/windows-terminal-settings.psm1'
      - 'scripts/core/windows-terminal-system.psm1'
      - 'scripts/wsl/manage-shell-profile.sh'
      - 'scripts/wsl/manage-devops-terminal.sh'
      - 'scripts/wsl/validate-devops-terminal.sh'
      - 'scripts/bootstrap/08_devops.ps1'
      - 'scripts/bootstrap/09_validate_devops.ps1'
      - 'scripts/bootstrap/10_workstation.ps1'
      - 'scripts/bootstrap/11_validate_windows.ps1'
      - 'scripts/windows/31_windows_terminal.ps1'
      - 'scripts/windows/31_windows_terminal_modern.ps1'
      - 'manifests/winget/apps-core.json'
      - '.github/workflows/devops-terminal.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned

      - name: Install validation tools from Ubuntu 26.04
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bash bash-completion shellcheck python3 passwd \
            starship fzf zoxide eza ripgrep fd-find bat tree

      - name: Parse and lint shell profile
        run: |
          bash -n config/wsl/bashrc.d/devops.sh
          bash -n scripts/wsl/manage-shell-profile.sh
          bash -n scripts/wsl/manage-devops-terminal.sh
          bash -n scripts/wsl/validate-devops-terminal.sh
          shellcheck \
            config/wsl/bashrc.d/devops.sh \
            scripts/wsl/manage-shell-profile.sh \
            scripts/wsl/manage-devops-terminal.sh \
            scripts/wsl/validate-devops-terminal.sh

      - name: Validate JSON and terminal contracts
        run: |
          python3 -m json.tool config/vscode/settings.json >/dev/null
          python3 -m json.tool config/windows-terminal/profiles.fragment.json >/dev/null
          python3 -m json.tool config/windows-terminal/actions.json >/dev/null
          python3 -m json.tool config/windows-terminal/settings.contract.json >/dev/null
          python3 -m json.tool manifests/winget/apps-core.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          apps = json.loads(Path('manifests/winget/apps-core.json').read_text())['apps']
          required_ids = {
              'Microsoft.WindowsTerminal',
              'Microsoft.PowerShell',
              'Starship.Starship',
              'DEVCOM.JetBrainsMonoNerdFont',
          }
          automatic_ids = {a['wingetId'] for a in apps if a['autoInstall'] and a['wingetId']}
          assert required_ids <= automatic_ids
          assert 'wez.wezterm' not in automatic_ids

          catalog = {a['name'] for a in apps}
          assert 'Windows Terminal' in catalog
          assert 'Starship' in catalog
          assert 'WezTerm' not in catalog

          vscode = json.loads(Path('config/vscode/settings.json').read_text())
          assert vscode['terminal.integrated.defaultProfile.windows'] == 'Ubuntu WSL'
          assert 'JetBrainsMono Nerd Font' in vscode['terminal.integrated.fontFamily']
          assert vscode['terminal.integrated.shellIntegration.enabled'] is True

          profiles = json.loads(Path('config/windows-terminal/profiles.fragment.json').read_text())['profiles']
          by_name = {p['name']: p for p in profiles}
          assert set(by_name) == {
              'PowerShell 7 - DevOps',
              'PowerShell 7 - DevOps (Admin)',
              'Ubuntu - DevOps',
          }
          assert by_name['PowerShell 7 - DevOps']['guid'] == '{a3cc45a8-6e2f-4f3d-bca6-7d6df942da41}'
          assert by_name['PowerShell 7 - DevOps (Admin)']['guid'] == '{4e9f9d45-562b-4e6e-9f61-8f8276d80e71}'
          assert by_name['Ubuntu - DevOps']['guid'] == '{dd62b4eb-e12e-4e52-8f67-71415727545c}'
          assert by_name['PowerShell 7 - DevOps']['commandline'] == 'pwsh.exe -NoLogo'
          assert by_name['PowerShell 7 - DevOps']['elevate'] is False
          assert by_name['PowerShell 7 - DevOps (Admin)']['elevate'] is True
          assert by_name['Ubuntu - DevOps']['startingDirectory'] == '~'
          assert '__WPC_DISTRIBUTION__' in by_name['Ubuntu - DevOps']['commandline']
          assert all(p['font']['face'] == 'JetBrainsMono Nerd Font' for p in profiles)
          assert all(p['suppressApplicationTitle'] is True for p in profiles)

          actions = json.loads(Path('config/windows-terminal/actions.json').read_text())['actions']
          keys = {a['keys']: a for a in actions}
          assert set(keys) == {
              'ctrl+t',
              'ctrl+shift+1',
              'ctrl+shift+2',
              'ctrl+shift+3',
              'ctrl+shift+r',
              'ctrl+w',
              'ctrl+shift+o',
          }
          assert keys['ctrl+t']['command']['profile'] == 'PowerShell 7 - DevOps'
          assert keys['ctrl+shift+1']['command']['profile'] == 'PowerShell 7 - DevOps'
          assert keys['ctrl+shift+2']['command']['profile'] == 'Ubuntu - DevOps'
          assert keys['ctrl+shift+3']['command']['profile'] == 'PowerShell 7 - DevOps (Admin)'
          assert keys['ctrl+shift+3']['command']['elevate'] is True
          assert keys['ctrl+shift+r']['command'] == 'openTabRenamer'
          assert keys['ctrl+w']['command']['action'] == 'closeTab'
          assert keys['ctrl+shift+o']['command']['action'] == 'wt'

          settings_contract = json.loads(Path('config/windows-terminal/settings.contract.json').read_text())
          assert settings_contract['globals']['theme'] == 'WPC DevOps'
          assert settings_contract['globals']['launchMode'] == 'maximized'
          assert settings_contract['globals']['windowingBehavior'] == 'useExisting'
          assert settings_contract['themes'][0]['window']['useMica'] is True
          assert {s['name'] for s in settings_contract['schemes']} == {
              'WPC DevOps', 'WPC DevOps Admin', 'WPC Ubuntu'
          }

          terminal_entry = Path('scripts/windows/31_windows_terminal.ps1').read_text()
          terminal_script = Path('scripts/windows/31_windows_terminal_modern.ps1').read_text()
          terminal_module = Path('scripts/core/windows-terminal-settings.psm1').read_text()
          terminal_system = Path('scripts/core/windows-terminal-system.psm1').read_text()
          assert '31_windows_terminal_modern.ps1' in terminal_entry
          for needle in [
              "ValidateSet('Audit', 'Apply', 'Verify', 'Rollback')",
              'terminal-devops.profiles.json',
              'terminal-devops.actions.json',
              'Save-InitialState',
              'Restore-InitialState',
              'Set-WpcDefaultTerminalApplication',
          ]:
              assert needle in terminal_script, needle
          for needle in [
              'disabledProfileSources',
              'Windows.Terminal.PowershellCore',
              'Windows.Terminal.Wsl',
              'LegacyImportName',
          ]:
              assert needle in terminal_module, needle
          for needle in [
              'HKCU:\\Console\\%%Startup',
              '{2EACA947-7F5F-4CFA-BA87-8F7FBEEFBE69}',
              '{E12CFF52-A866-4C77-9A90-F570A7AA2C6B}',
          ]:
              assert needle in terminal_system, needle
          for forbidden in ['Set-WslShell', 'Invoke-WebRequest', 'wez.wezterm', 'config\\wezterm']:
              assert forbidden not in terminal_script, forbidden

          combined = '\n'.join([
              Path('config/windows-terminal/profiles.fragment.json').read_text(),
              Path('config/windows-terminal/actions.json').read_text(),
              Path('config/windows-terminal/settings.contract.json').read_text(),
              Path('config/windows-terminal/starship.windows.toml').read_text(),
              terminal_entry,
              terminal_script,
              terminal_module,
              terminal_system,
          ]).lower()
          for forbidden in ['openclaw', 'clawops', 'openrouter']:
              assert forbidden not in combined, forbidden

          profile = Path('config/wsl/bashrc.d/devops.sh').read_text()
          for needle in ['starship init bash', 'zoxide init bash', 'fzf --bash', "alias tf='terraform'", "alias k='kubectl'"]:
              assert needle in profile, needle
          PY

      - name: Validate Starship configurations
        run: |
          STARSHIP_CONFIG="$PWD/config/wsl/starship.toml" starship prompt >/dev/null
          STARSHIP_CONFIG="$PWD/config/windows-terminal/starship.windows.toml" starship prompt >/dev/null

      - name: Prove Linux terminal root/user split, idempotence and rollback
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          useradd --create-home --shell /bin/bash terminaltest
          printf '# user bashrc\n' > /home/terminaltest/.bashrc
          cp /home/terminaltest/.bashrc /home/terminaltest/original.bashrc
          chown -R terminaltest:terminaltest /home/terminaltest

          # Force one real system gap so Apply must exercise the root APT path.
          apt-get remove -y tree
          if command -v tree >/dev/null 2>&1; then
            echo 'tree should be absent before the root Apply proof.' >&2
            exit 1
          fi

          first_output="$(bash scripts/wsl/manage-devops-terminal.sh apply --target-user terminaltest)"
          printf '%s\n' "$first_output"
          command -v tree >/dev/null
          runuser --user terminaltest -- env HOME=/home/terminaltest bash scripts/wsl/manage-devops-terminal.sh verify
          first_hash="$(sha256sum /home/terminaltest/.bashrc | awk '{print $1}')"

          second_output="$(bash scripts/wsl/manage-devops-terminal.sh apply --target-user terminaltest)"
          printf '%s\n' "$second_output"
          runuser --user terminaltest -- env HOME=/home/terminaltest bash scripts/wsl/manage-devops-terminal.sh verify
          second_hash="$(sha256sum /home/terminaltest/.bashrc | awk '{print $1}')"

          test "$first_hash" = "$second_hash"
          grep -Fq '[DÉJÀ OK] Terminal DevOps déjà conforme' <<<"$second_output"
          test "$(grep -Fc '# BEGIN windows11-pro-custom' /home/terminaltest/.bashrc)" -eq 1
          test "$(grep -Fc '# END windows11-pro-custom' /home/terminaltest/.bashrc)" -eq 1

          runuser --user terminaltest -- env HOME=/home/terminaltest bash --noprofile --rcfile /home/terminaltest/.bashrc -ic \
            'command -v starship >/dev/null; command -v fzf >/dev/null; command -v zoxide >/dev/null; type k >/dev/null; type tf >/dev/null; type ll >/dev/null; type fd >/dev/null; type bat >/dev/null'

          bash scripts/wsl/manage-devops-terminal.sh rollback --target-user terminaltest
          cmp -s /home/terminaltest/.bashrc /home/terminaltest/original.bashrc
          test ! -e /home/terminaltest/.config/windows11-pro-custom/devops.sh
          test ! -e /home/terminaltest/.config/windows11-pro-custom/starship.toml
          if command -v tree >/dev/null 2>&1; then
            echo 'tree should be absent after rollback.' >&2
            exit 1
          fi

  windows-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned

      - name: Parse Windows Terminal PowerShell components
        shell: pwsh
        run: |
          foreach ($path in @(
            '.\scripts\core\windows-terminal-settings.psm1',
            '.\scripts\core\windows-terminal-system.psm1',
            '.\scripts\windows\31_windows_terminal.ps1',
            '.\scripts\windows\31_windows_terminal_modern.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if (@($errors).Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              exit 1
            }
          }

      - name: Parse managed Windows Terminal JSON
        shell: pwsh
        run: |
          Get-Content -Raw '.\config\windows-terminal\profiles.fragment.json' | ConvertFrom-Json | Out-Null
          Get-Content -Raw '.\config\windows-terminal\actions.json' | ConvertFrom-Json | Out-Null
          Get-Content -Raw '.\config\windows-terminal\settings.contract.json' | ConvertFrom-Json | Out-Null
