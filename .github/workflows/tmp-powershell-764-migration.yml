name: Temporary PowerShell 7.6.4 migration

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-powershell-764-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
        with:
          ref: refactor/powershell-7-only
          fetch-depth: 0

      - name: Align CI runtime and hosted SystemRestore probes
        shell: python
        run: |
          from pathlib import Path

          root = Path('.github/workflows')
          temporary = Path('.github/workflows/tmp-powershell-764-migration.yml')
          provider_line = "$class = Get-CimClass -Namespace 'root/default' -ClassName SystemRestore -ErrorAction Stop"
          provider_probe = """try {
            $class = Get-CimClass -Namespace 'root/default' -ClassName SystemRestore -ErrorAction Stop
          } catch {
            Write-Warning 'SystemRestore is not exposed by this hosted Windows Server runner; physical Windows 11 validation remains fail-closed.'
            return
          }"""

          for path in root.glob('*.yml'):
              if path == temporary:
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('7.6.5', '7.6.4')
              if path.name in {
                  'restore-point-capability.yml',
                  'restore-point-exitcode.yml',
                  'physical-foundation.yml',
              }:
                  text = text.replace(provider_line, provider_probe)
              path.write_text(text, encoding='utf-8')

      - name: Commit CI migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/control-center.yml .github/workflows/native-exitcode.yml .github/workflows/physical-foundation.yml .github/workflows/powershell-7-only.yml .github/workflows/quality.yml .github/workflows/restore-point-capability.yml .github/workflows/restore-point-exitcode.yml .github/workflows/terminal-ux.yml
          if git diff --cached --quiet; then
            echo 'No CI migration changes required.'
            exit 0
          fi
          git commit -m 'ci: complete PowerShell 7.6.4 runtime migration'
          git push origin HEAD:refactor/powershell-7-only
