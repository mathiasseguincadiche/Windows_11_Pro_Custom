name: Documentation semantic contract

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - menu.ps1
      - install.ps1
      - update.ps1
      - .github/workflows/documentation-semantic.yml
  pull_request:
    paths:
      - README.md
      - docs/**
      - menu.ps1
      - install.ps1
      - update.ps1
      - .github/workflows/documentation-semantic.yml

permissions:
  contents: read

jobs:
  semantic-documentation:
    name: Code ↔ documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned

      - name: Vérifier les commandes install.ps1 et update.ps1 documentées
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Get-PublicParameterNames {
              param([Parameter(Mandatory)][string]$Path)
              $tokens = $null
              $errors = $null
              $ast = [System.Management.Automation.Language.Parser]::ParseFile(
                  (Resolve-Path $Path),
                  [ref]$tokens,
                  [ref]$errors
              )
              if (@($errors).Count -gt 0) {
                  throw "Impossible d'analyser $Path : $(@($errors).Message -join '; ')"
              }
              if (-not $ast.ParamBlock) { throw "Bloc param() absent: $Path" }
              return @($ast.ParamBlock.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath })
          }

          $allowedInstall = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $allowedUpdate = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          Get-PublicParameterNames -Path './install.ps1' | ForEach-Object { [void]$allowedInstall.Add($_) }
          Get-PublicParameterNames -Path './update.ps1' | ForEach-Object { [void]$allowedUpdate.Add($_) }

          $markdownFiles = @((Get-Item './README.md')) + @(Get-ChildItem './docs' -Filter '*.md' -File | Sort-Object FullName)
          $fenceRegex = [regex]::new('```(?:powershell|pwsh)?\s*\r?\n(.*?)```', [Text.RegularExpressions.RegexOptions]::IgnoreCase -bor [Text.RegularExpressions.RegexOptions]::Singleline)
          $switchRegex = [regex]::new('(?<![\w])-(?<name>[A-Za-z][A-Za-z0-9]*)\b')
          $errorsFound = [System.Collections.Generic.List[string]]::new()

          foreach ($path in $markdownFiles) {
              $text = Get-Content -Raw -LiteralPath $path.FullName
              foreach ($fence in $fenceRegex.Matches($text)) {
                  $block = $fence.Groups[1].Value
                  $compact = [regex]::Replace($block, '`\s*\r?\n\s*', ' ')
                  foreach ($command in [regex]::Split($compact, '[\r\n;]+')) {
                      if ($command -match '(?i)(?:^|[\\/])install\.ps1\b') {
                          foreach ($match in $switchRegex.Matches($command)) {
                              $name = $match.Groups['name'].Value
                              if (-not $allowedInstall.Contains($name)) {
                                  $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $path.FullName)
                                  $errorsFound.Add("$relative: paramètre install.ps1 inconnu -$name")
                              }
                          }
                      }
                      if ($command -match '(?i)(?:^|[\\/])update\.ps1\b') {
                          foreach ($match in $switchRegex.Matches($command)) {
                              $name = $match.Groups['name'].Value
                              if (-not $allowedUpdate.Contains($name)) {
                                  $relative = [IO.Path]::GetRelativePath((Get-Location).Path, $path.FullName)
                                  $errorsFound.Add("$relative: paramètre update.ps1 inconnu -$name")
                              }
                          }
                      }
                  }
              }
          }

          if ($errorsFound.Count -gt 0) {
              throw (($errorsFound | Sort-Object -Unique) -join "`n")
          }

      - name: Vérifier les corrections documentaires critiques
        shell: python
        run: |
          from pathlib import Path

          hardware = Path('docs/12_HARDWARE_QUALIFICATION.md').read_text(encoding='utf-8')
          updates = Path('docs/15_MISES_A_JOUR.md').read_text(encoding='utf-8')
          control = Path('docs/17_CONTROL_CENTER.md').read_text(encoding='utf-8')
          guide = Path('docs/18_GUIDE_MAITRE.md').read_text(encoding='utf-8')
          portal = Path('docs/README.md').read_text(encoding='utf-8')

          if 'E: pour les données, WSL2, OpenClaw' in hardware:
              raise SystemExit('docs/12 réintroduit OpenClaw dans le contrat de stockage.')
          if '.\\install.ps1 -Mode Verify -ValidateOpenClawAI' in updates:
              raise SystemExit('docs/15 contient encore une commande OpenClaw obsolète.')

          required_control = [
              'WSL2 + stack DevOps + validation',
              'Qualification matérielle guidée',
              'Audit empreinte SIMULATED',
              'Audit empreinte PHYSICAL',
              'Vérifier la dérive PHYSICAL',
              'Enregistrer la baseline PHYSICAL',
              'Remplacer la baseline PHYSICAL',
          ]
          missing = [item for item in required_control if item not in control]
          if missing:
              raise SystemExit('docs/17 n’est pas synchronisé avec menu.ps1: ' + ', '.join(missing))

          for path, text in [
              ('docs/README.md', portal),
              ('docs/18_GUIDE_MAITRE.md', guide),
          ]:
              if 'GLOSSAIRE.md' not in text:
                  raise SystemExit(f'{path} ne référence pas le glossaire.')

      - name: Vérifier les invariants pédagogiques du README
        shell: python
        run: |
          from pathlib import Path

          text = Path('README.md').read_text(encoding='utf-8')
          required = [
              'À qui s’adresse ce projet ?' if 'À qui s’adresse ce projet ?' in text else "À qui s'adresse ce projet ?",
              'Ce qui est géré — et ce qui ne l’est pas' if 'Ce qui est géré — et ce qui ne l’est pas' in text else "Ce qui est géré — et ce qui ne l'est pas",
              'Par où commencer ?',
              'Quick start',
              'Comprendre les modes',
              'Quand la workstation est-elle prête ?',
              'docs/GLOSSAIRE.md',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('README pédagogique incomplet: ' + ', '.join(missing))
