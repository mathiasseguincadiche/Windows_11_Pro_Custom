name: DevOps privilege contract

on:
  pull_request:
    paths:
      - 'scripts/bootstrap/08_devops.ps1'
      - 'scripts/wsl/install-devops.sh'
      - 'scripts/wsl/install-quality-tools.sh'
      - 'scripts/wsl/manage-devops-terminal.sh'
      - '.github/workflows/devops-privilege-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap/08_devops.ps1'
      - 'scripts/wsl/install-devops.sh'
      - 'scripts/wsl/install-quality-tools.sh'
      - 'scripts/wsl/manage-devops-terminal.sh'
      - '.github/workflows/devops-privilege-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned

      - name: Parse scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/wsl/install-devops.sh
          bash -n scripts/wsl/install-quality-tools.sh
          bash -n scripts/wsl/manage-devops-terminal.sh

      - name: Enforce root system boundary and target-user ownership
        shell: bash
        run: |
          set -euo pipefail
          ps='scripts/bootstrap/08_devops.ps1'
          install='scripts/wsl/install-devops.sh'
          quality='scripts/wsl/install-quality-tools.sh'
          terminal='scripts/wsl/manage-devops-terminal.sh'

          test "$(grep -Fc "'--user', 'root'" "$ps")" -ge 2
          test "$(grep -Fc "'--target-user', \$LinuxUser" "$ps")" -ge 2
          grep -Fq "Aucun mot de passe n'est transmis" "$ps"
          grep -Fq 'Paquets Terminal via root WSL' "$ps"

          grep -Fq 'if [[ ${EUID} -ne 0 ]]' "$install"
          grep -Fq -- '--target-user' "$install"
          grep -Fq 'TARGET_USER' "$install"
          grep -Fq 'runuser -u "$TARGET_USER"' "$install"
          grep -Fq 'usermod -aG docker "$TARGET_USER"' "$install"
          grep -Fq 'TARGET_HOME' "$install"
          grep -Fq 'install -d -m 0755 -o "$TARGET_USER" -g "$TARGET_GROUP"' "$install"

          # Les deux chemins automatisés doivent être exempts de vraies commandes sudo.
          if grep -En '^[[:space:]]*sudo([[:space:]]|$)' "$install" "$terminal"; then
            echo 'Interactive sudo dependency detected in automated WSL bootstrap.' >&2
            exit 1
          fi

          grep -Fq -- '--target-user' "$terminal"
          grep -Fq 'runuser --user "$target_user"' "$terminal"
          grep -Fq 'apt-get install -y --no-install-recommends' "$terminal"
          grep -Fq 'apt-get remove -y' "$terminal"
          grep -Fq 'aucun prompt sudo interactif' "$terminal"

          grep -Fq 'as_root()' "$quality"
          grep -Fq 'if [[ ${EUID} -eq 0 ]]' "$quality"
          grep -Fq 'verify_github_attestation_if_authenticated()' "$quality"
          grep -Fq 'gh auth status' "$quality"
          grep -Fq 'la vérification SHA-256 épinglée reste obligatoire' "$quality"

      - name: Parse PowerShell orchestrator
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/bootstrap/08_devops.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if (@($errors).Count -gt 0) {
            throw "08_devops.ps1 parse errors: $($errors.Message -join '; ')"
          }

      - name: Prove core installer refuses unprivileged automation before mutation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(id -u)" -eq 0 ]]; then
            useradd --create-home privilegeprobe
            set +e
            output="$(runuser -u privilegeprobe -- bash scripts/wsl/install-devops.sh --target-user privilegeprobe 2>&1)"
            code=$?
            set -e
          else
            sudo useradd --create-home privilegeprobe
            set +e
            output="$(sudo runuser -u privilegeprobe -- bash scripts/wsl/install-devops.sh --target-user privilegeprobe 2>&1)"
            code=$?
            set -e
          fi
          test "$code" -eq 1
          grep -Fq 'doit être lancé par l orchestrateur avec le compte root WSL' <<<"$output"
          if grep -Eq 'apt-get|docker-ce|/usr/local/bin' <<<"$output"; then
            echo 'The unprivileged core rejection path must fail before any mutation.' >&2
            exit 1
          fi

      - name: Prove terminal installer refuses hidden privilege escalation
        shell: bash
        run: |
          set -euo pipefail
          fakebin="$(mktemp -d)"
          chmod 0755 "$fakebin"
          cat >"$fakebin/dpkg-query" <<'EOF'
          #!/usr/bin/env bash
          exit 1
          EOF
          chmod 0755 "$fakebin/dpkg-query"

          if [[ "$(id -u)" -eq 0 ]]; then
            useradd --create-home terminalprobe
            printf '# original\n' > /home/terminalprobe/.bashrc
            chown -R terminalprobe:terminalprobe /home/terminalprobe
            before="$(sha256sum /home/terminalprobe/.bashrc | awk '{print $1}')"
            set +e
            output="$(runuser -u terminalprobe -- env HOME=/home/terminalprobe PATH="$fakebin:$PATH" bash scripts/wsl/manage-devops-terminal.sh apply 2>&1)"
            code=$?
            set -e
          else
            sudo useradd --create-home terminalprobe
            printf '# original\n' | sudo tee /home/terminalprobe/.bashrc >/dev/null
            sudo chown -R terminalprobe:terminalprobe /home/terminalprobe
            before="$(sha256sum /home/terminalprobe/.bashrc | awk '{print $1}')"
            set +e
            output="$(sudo runuser -u terminalprobe -- env HOME=/home/terminalprobe PATH="$fakebin:$PATH" bash scripts/wsl/manage-devops-terminal.sh apply 2>&1)"
            code=$?
            set -e
          fi
          test "$code" -eq 1
          grep -Fq 'doit être lancé par l orchestrateur avec root WSL et --target-user' <<<"$output"
          after="$(sha256sum /home/terminalprobe/.bashrc | awk '{print $1}')"
          test "$before" = "$after"
          test ! -e /home/terminalprobe/.config/windows11-pro-custom/devops.sh
