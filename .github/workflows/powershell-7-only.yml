name: PowerShell 7 only

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned

      - name: Validate canonical runtime policy
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            (.schemaVersion == 1) and
            (.edition == "Core") and
            (.minimumVersion == "7.6.4") and
            (.architecture == "x64") and
            (.executable == "pwsh.exe") and
            (.windowsPowerShellSupported == false)
          ' config/powershell/runtime.json >/dev/null
          grep -Fq "MinimumVersion = [version]'7.6.4'" scripts/core/powershell-runtime.psm1
          grep -Fq "ExecutableName -ine 'pwsh.exe'" scripts/core/powershell-runtime.psm1

      - name: Reject Windows PowerShell execution fallbacks
        shell: bash
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(find . -type f \( -name '*.ps1' -o -name '*.psm1' -o -name '*.cmd' \) -not -path './.git/*' -print0)
          if grep -nEi '(^|[^[:alnum:]_])powershell\.exe([^[:alnum:]_]|$)' "${files[@]}"; then
            echo 'Windows PowerShell executable reference detected in executable repository code.' >&2
            exit 1
          fi
          if grep -RInE '^[[:space:]]*shell:[[:space:]]+powershell([[:space:]]|$)' .github/workflows; then
            echo 'GitHub Actions must use pwsh, never Windows PowerShell.' >&2
            exit 1
          fi
          if grep -RInF 'Get-WindowsPowerShell51Path' scripts --include='*.ps1' --include='*.psm1'; then
            echo 'Legacy Windows PowerShell 5.1 helper detected.' >&2
            exit 1
          fi
          if grep -RInF 'Checkpoint-Computer' scripts --include='*.ps1' --include='*.psm1'; then
            echo 'Checkpoint-Computer fallback detected; restore points must use SystemRestore CIM from PowerShell 7.' >&2
            exit 1
          fi

      - name: Prove PowerShell 7-only wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'where pwsh.exe' START_MENU.cmd
          ! grep -Fiq 'where powershell.exe' START_MENU.cmd
          grep -Fq 'Assert-WpcPowerShellRuntime' menu.ps1
          grep -Fq "[version]'7.6.4'" menu.ps1
          grep -Fq 'Repair-WpcWinGetPowerShell7' scripts/bootstrap/02_foundation.ps1
          grep -Fq 'Repair-WinGetPackageManager -Force -Latest' scripts/bootstrap/02_foundation.ps1
          grep -Fq "ClassName 'SystemRestore'" scripts/windows/41_restore_point.ps1
          grep -Fq "MethodName 'CreateRestorePoint'" scripts/windows/41_restore_point.ps1
          grep -Fq '& $RestorePointScript' scripts/backup/60_create_backup.ps1
