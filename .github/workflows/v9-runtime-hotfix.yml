name: V9 runtime hotfix

on:
  push:
    branches: [feat/orchestration-idempotence-v9]
    paths:
      - '.github/workflows/v9-runtime-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/orchestration-idempotence-v9
          fetch-depth: 0
      - name: Fix log path normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/core/runtime.psm1')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          replacement = "    if ($relative.StartsWith('scripts\\', [StringComparison]::OrdinalIgnoreCase)) { $relative = $relative.Substring(8) }\n"
          hits = 0
          out = []
          for line in lines:
              if "$relative = $relative -replace '^scripts" in line:
                  out.append(replacement)
                  hits += 1
              else:
                  out.append(line)
          if hits != 1:
              raise SystemExit(f'Expected exactly one runtime log-path line, found {hits}')
          path.write_text(''.join(out), encoding='utf-8', newline='\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/core/runtime.psm1
          git commit -m 'fix: normalize V9 script log paths without regex'
          git push origin HEAD:feat/orchestration-idempotence-v9
