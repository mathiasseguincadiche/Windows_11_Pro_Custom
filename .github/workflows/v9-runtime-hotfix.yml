name: V9 runtime hotfix

on:
  push:
    branches: [feat/orchestration-idempotence-v9]
    paths:
      - '.github/workflows/v9-runtime-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/orchestration-idempotence-v9
          fetch-depth: 0
      - name: Fix log path normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/core/runtime.psm1')
          text = path.read_text(encoding='utf-8')
          old = "    $relative = $relative -replace '^scripts\\\\', ''\n"
          new = "    if ($relative.StartsWith('scripts\\', [StringComparison]::OrdinalIgnoreCase)) { $relative = $relative.Substring(8) }\n"
          if old not in text:
              raise SystemExit('Expected runtime log-path line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/core/runtime.psm1
          git commit -m 'fix: normalize V9 script log paths without regex'
          git push origin HEAD:feat/orchestration-idempotence-v9
