name: Workstation evidence

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'scripts/windows/90_workstation_fingerprint.ps1'
      - 'scripts/backup/60_create_backup.ps1'
      - 'scripts/backup/61_validate_backup.ps1'
      - 'scripts/backup/63_restore_drill.ps1'
      - 'tests/powershell/workstation_evidence_contract.tests.ps1'
      - 'docs/23_SOURCES_DE_VERITE.md'
      - 'docs/24_CRITERES_ACCEPTATION.md'
      - 'docs/26_PREUVES_DRIFT_ET_RESTAURATION.md'
      - 'config/**'
      - 'manifests/**'
      - '.github/workflows/workstation-evidence.yml'
  pull_request:
    paths:
      - 'VERSION'
      - 'scripts/windows/90_workstation_fingerprint.ps1'
      - 'scripts/backup/60_create_backup.ps1'
      - 'scripts/backup/61_validate_backup.ps1'
      - 'scripts/backup/63_restore_drill.ps1'
      - 'tests/powershell/workstation_evidence_contract.tests.ps1'
      - 'docs/23_SOURCES_DE_VERITE.md'
      - 'docs/24_CRITERES_ACCEPTATION.md'
      - 'docs/26_PREUVES_DRIFT_ET_RESTAURATION.md'
      - 'config/**'
      - 'manifests/**'
      - '.github/workflows/workstation-evidence.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Verify workstation evidence contract
        shell: bash
        run: |
          set -euo pipefail
          fingerprint='scripts/windows/90_workstation_fingerprint.ps1'
          restore='scripts/backup/63_restore_drill.ps1'
          doc='docs/26_PREUVES_DRIFT_ET_RESTAURATION.md'

          test -f "$fingerprint"
          test -f "$restore"
          test -f "$doc"

          grep -Fq "ValidateSet('Audit','Record','Verify')" "$fingerprint"
          grep -Fq 'ConfirmHealthyState' "$fingerprint"
          grep -Fq 'ConfirmPhysicalEvidence' "$fingerprint"
          grep -Fq 'ReplaceBaseline' "$fingerprint"
          grep -Fq 'ReplacementReason' "$fingerprint"
          grep -Fq 'workstation-fingerprint.json' "$fingerprint"
          grep -Fq 'repositoryRevision' "$fingerprint"
          grep -Fq 'contractDigestSha256' "$fingerprint"
          grep -Fq 'storageIdentitySha256' "$fingerprint"
          grep -Fq 'LocalBaselineHashPath' "$fingerprint"
          grep -Fq 'Get-WpcBaselineIntegrity' "$fingerprint"
          grep -Fq 'Aucun remplacement silencieux' "$fingerprint"
          grep -Fq 'WORKSTATION FINGERPRINT DRIFT' "$fingerprint"
          grep -Fq 'Release=$Release;SchemaVersion=1' "$fingerprint"

          grep -Fq "ValidateSet('Verify','Sandbox')" "$restore"
          grep -Fq 'ConfirmIsolatedRestoreDrill' "$restore"
          grep -Fq 'wsl.exe --import-in-place' "$restore"
          grep -Fq 'finally {' "$restore"
          # shellcheck disable=SC2016
          grep -Fq 'wsl.exe --unregister $TemporaryDistribution' "$restore"
          grep -Fq "VERSION_ID=26\\.04" "$restore"
          grep -Fq 'RESTORE DRILL SANDBOX READY' "$restore"
          grep -Fq 'wbadminVersionIdentifier' "$restore"
          grep -Fq 'RequiredScratchBytes' "$restore"
          grep -Fq 'UnregisterExitCode' "$restore"
          grep -Fq 'Copie scratch conservée' "$restore"

          # shellcheck disable=SC2016
          grep -Fq '`STATIC`' "$doc"
          # shellcheck disable=SC2016
          grep -Fq '`SIMULATED`' "$doc"
          # shellcheck disable=SC2016
          grep -Fq '`PHYSICAL`' "$doc"
          grep -Fq 'WinRE/offline' "$doc"

      - name: Reject unsafe evidence operations
        shell: bash
        run: |
          set -euo pipefail
          files=(
            'scripts/windows/90_workstation_fingerprint.ps1'
            'scripts/backup/63_restore_drill.ps1'
          )
          forbidden='Format-Volume|Clear-Disk|Initialize-Disk|Remove-Partition|Resize-Partition|Set-Partition|diskpart|Repair-Volume|chkdsk|ntfsfix|wbadmin[.]exe[[:space:]]+start[[:space:]]+recovery'
          if grep -InE "$forbidden" "${files[@]}"; then
            echo 'Evidence paths must not repair, repartition or restore Windows automatically.' >&2
            exit 1
          fi
          # shellcheck disable=SC2016
          if grep -InE 'wsl[.]exe[[:space:]]+--unregister[[:space:]]+(Ubuntu|\$Distribution)' scripts/backup/63_restore_drill.ps1; then
            echo 'Restore drill must never unregister the production distribution.' >&2
            exit 1
          fi

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Parse workstation evidence PowerShell
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @(
            '.\scripts\windows\90_workstation_fingerprint.ps1',
            '.\scripts\backup\63_restore_drill.ps1',
            '.\tests\powershell\workstation_evidence_contract.tests.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            foreach ($parseError in @($errors)) {
              $failed = $true
              Write-Host "::error file=$path,line=$($parseError.Extent.StartLineNumber),col=$($parseError.Extent.StartColumnNumber)::$($parseError.Message)"
            }
          }
          if ($failed) { exit 1 }

      - name: Exercise fingerprint Audit on Windows runner
        shell: pwsh
        run: |
          .\scripts\windows\90_workstation_fingerprint.ps1 -Mode Audit
          $release = (Get-Content -Raw '.\VERSION').Trim()
          $report = Get-Content -Raw '.\reports\workstation\latest.json' | ConvertFrom-Json
          if ($report.Release -ne $release) { throw "Unexpected report release: $($report.Release)" }
          if ([int]$report.SchemaVersion -ne 1) { throw 'Unexpected workstation report schema.' }
          if ($report.evidenceLevel -ne 'SIMULATED') { throw 'A hosted runner must emit SIMULATED evidence.' }
          if ([string]::IsNullOrWhiteSpace([string]$report.repositoryRevision)) { throw 'Repository revision missing.' }
          if ([string]::IsNullOrWhiteSpace([string]$report.contractDigestSha256)) { throw 'Contract digest missing.' }

          $rejected = $false
          try {
            .\scripts\windows\90_workstation_fingerprint.ps1 -Mode Audit -EvidenceLevel PHYSICAL -ConfirmPhysicalEvidence
          } catch {
            $rejected = $_.Exception.Message -match 'ne peut jamais produire une preuve PHYSICAL'
          }
          if (-not $rejected) { throw 'A hosted runner must reject PHYSICAL evidence.' }

      - name: Exercise evidence diff and wbadmin parsers
        shell: pwsh
        run: .\tests\powershell\workstation_evidence_contract.tests.ps1
