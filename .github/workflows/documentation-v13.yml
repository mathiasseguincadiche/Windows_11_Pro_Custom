name: Documentation V13

on:
  push:
    branches:
      - main
      - docs/documentation-v13
    paths:
      - README.md
      - CHANGELOG.md
      - docs/**
      - .github/workflows/documentation-v13.yml
  pull_request:
    paths:
      - README.md
      - CHANGELOG.md
      - docs/**
      - .github/workflows/documentation-v13.yml

permissions:
  contents: read

jobs:
  documentation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify canonical documentation files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            docs/README.md
            docs/00_ARCHITECTURE.md
            docs/01_INSTALLATION_WINDOWS.md
            docs/13_RUNBOOK_REINSTALLATION.md
            docs/16_WSL2_GUIDE_COMPLET.md
            docs/18_BACKUP_DISASTER_RECOVERY_V7.md
            docs/21_ORCHESTRATION_IDEMPOTENCE_V9.md
            docs/21_DEVOPS_TERMINAL_V10.md
            docs/22_SYSTEM_UPDATE_MANAGER_V11.md
            docs/23_INTERACTIVE_CONTROL_CENTER_V12.md
            docs/24_GUIDE_MAITRE_V13.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Documentation requise absente/vide: $file" >&2; exit 1; }
          done

      - name: Reject stale canonical references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RFn 'docs/12_RUNBOOK_REINSTALLATION.md' README.md docs; then
            echo 'Ancien chemin de Runbook interdit: utiliser docs/13_RUNBOOK_REINSTALLATION.md.' >&2
            exit 1
          fi
          if grep -Fq 'Unreleased — V9' CHANGELOG.md; then
            echo 'Le changelog ne doit plus présenter V9 comme version Unreleased actuelle.' >&2
            exit 1
          fi
          if grep -Fq 'wsl --export Ubuntu D:\BACKUPS\Ubuntu-DevOps.tar' docs/13_RUNBOOK_REINSTALLATION.md; then
            echo 'Le Runbook ne doit pas revenir à l’ancien backup WSL manuel comme stratégie principale.' >&2
            exit 1
          fi

      - name: Verify current architecture markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'centre de contrôle' README.md
          grep -Fq 'System Update Manager V11' README.md
          grep -Fq 'Golden Backup V7' README.md
          grep -Fq 'Ubuntu 26.04' README.md
          grep -Fq 'D:\WSL\Ubuntu-DevOps' README.md
          grep -Fq 'D:\AI\OpenClaw' README.md
          grep -Fq 'V12' README.md
          grep -Fq 'V13' README.md

          grep -Fq 'FullInstall' docs/13_RUNBOOK_REINSTALLATION.md
          grep -Fq 'PlanOnly' docs/13_RUNBOOK_REINSTALLATION.md
          grep -Fq 'ValidateHardware' docs/13_RUNBOOK_REINSTALLATION.md
          grep -Fq 'ValidateWsl' docs/13_RUNBOOK_REINSTALLATION.md
          grep -Fq 'ValidateDevOps' docs/13_RUNBOOK_REINSTALLATION.md
          grep -Fq 'BackupAction RestorePlan' docs/13_RUNBOOK_REINSTALLATION.md
          grep -Fq 'update.ps1 -Mode Apply' docs/13_RUNBOOK_REINSTALLATION.md
          grep -Fq 'Ubuntu-Restore-V7' docs/13_RUNBOOK_REINSTALLATION.md

          grep -Fq 'Machine-first' docs/24_GUIDE_MAITRE_V13.md
          grep -Fq 'V10' docs/24_GUIDE_MAITRE_V13.md
          grep -Fq 'V11' docs/24_GUIDE_MAITRE_V13.md
          grep -Fq 'V12' docs/24_GUIDE_MAITRE_V13.md

      - name: Check local Markdown links
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import unquote
          import re
          import sys

          root = Path.cwd().resolve()
          files = [root / 'README.md', root / 'CHANGELOG.md'] + sorted((root / 'docs').glob('*.md'))
          link_re = re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)')
          errors = []

          for md in files:
              if not md.exists():
                  continue
              text = md.read_text(encoding='utf-8')
              for line_no, line in enumerate(text.splitlines(), start=1):
                  for match in link_re.finditer(line):
                      raw = match.group(1).strip()
                      if raw.startswith('<') and raw.endswith('>'):
                          raw = raw[1:-1].strip()
                      if not raw:
                          continue
                      lowered = raw.lower()
                      if lowered.startswith(('http://', 'https://', 'mailto:', 'tel:', 'data:')):
                          continue
                      if raw.startswith('#'):
                          continue
                      target = raw.split('#', 1)[0].split('?', 1)[0].strip()
                      if not target:
                          continue
                      target = unquote(target)
                      if re.match(r'^[A-Za-z]:[\\/]', target):
                          continue
                      resolved = (md.parent / target).resolve()
                      try:
                          resolved.relative_to(root)
                      except ValueError:
                          errors.append(f'{md.relative_to(root)}:{line_no}: lien sort du dépôt: {raw}')
                          continue
                      if not resolved.exists():
                          errors.append(f'{md.relative_to(root)}:{line_no}: cible locale absente: {raw}')

          if errors:
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)
          print(f'Liens Markdown locaux valides dans {len(files)} fichiers.')

      - name: Check beginner-document minimum depth
        shell: python
        run: |
          from pathlib import Path

          limits = {
              'README.md': 5000,
              'docs/01_INSTALLATION_WINDOWS.md': 10000,
              'docs/13_RUNBOOK_REINSTALLATION.md': 12000,
              'docs/24_GUIDE_MAITRE_V13.md': 15000,
          }
          for name, minimum in limits.items():
              size = Path(name).stat().st_size
              if size < minimum:
                  raise SystemExit(f'{name}: {size} octets, minimum documentaire attendu={minimum}')
              print(f'{name}: {size} octets OK')
