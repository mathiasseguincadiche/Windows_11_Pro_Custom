name: Windows responsiveness V8

on:
  pull_request:
    paths:
      - '.github/workflows/responsiveness-v8.yml'
      - 'config/windows/v8/responsiveness.json'
      - 'scripts/windows/53_responsiveness_v8.ps1'
      - 'scripts/windows/42_benchmark.ps1'
      - 'scripts/windows/43_compare_benchmarks.ps1'
      - 'install.ps1'
      - 'docs/20_WINDOWS_RESPONSIVENESS_V8.md'
      - 'CHANGELOG.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/responsiveness-v8.yml'
      - 'config/windows/v8/responsiveness.json'
      - 'scripts/windows/53_responsiveness_v8.ps1'
      - 'scripts/windows/42_benchmark.ps1'
      - 'scripts/windows/43_compare_benchmarks.ps1'
      - 'install.ps1'
      - 'docs/20_WINDOWS_RESPONSIVENESS_V8.md'
      - 'CHANGELOG.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate V8 policy
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            (.version == "V8") and
            (.reviewedAt == "2026-08-12") and
            (.memory.memoryCompression == true) and
            (.memory.applicationLaunchPrefetching == true) and
            (.memory.applicationPreLaunch == true) and
            (.memory.pageCombining == "observe-only") and
            (.pageFile.systemManaged == true) and
            (.pageFile.crashDumpEnabled == 7) and
            (.power.activeSchemeGuid == "381b4222-f694-41f0-9685-ff5bb260df2e") and
            (.power.acPowerModeGuid == "ded574b5-45a0-4f42-8737-46345c09c238") and
            (.power.keepDynamicProcessorManagement == true) and
            (.storage.requireTrim == true) and
            (.storage.keepScheduledOptimize == true) and
            (.startup.automaticDisable == false) and
            (.backgroundApps.globalDisable == false) and
            (.storage.syntheticWriteBenchmark == false)
          ' config/windows/v8/responsiveness.json >/dev/null
      - name: Enforce responsiveness safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/windows/53_responsiveness_v8.ps1'
          forbidden='EmptyStandbyList|Clear-Standby|bcdedit|useplatformclock|disabledynamictick|Set-Service|Stop-Service|Set-MpPreference|DisableRealtimeMonitoring|Remove-AppxPackage|Disable-WindowsOptionalFeature|winget[[:space:]]+uninstall|Optimize-Volume.*-Defrag|DisableDeleteNotify[[:space:]]+1'
          if grep -nEi "$forbidden" "$script"; then
            echo 'Unsafe V8 responsiveness tweak detected.' >&2
            exit 1
          fi
          grep -Fq "AutomaticManagedPagefile = \$true" "$script"
          grep -Fq 'Enable-MMAgent -MemoryCompression' "$script"
          grep -Fq 'Enable-MMAgent -ApplicationLaunchPrefetching' "$script"
          grep -Fq 'Enable-MMAgent -ApplicationPreLaunch' "$script"
          grep -Fq 'Startup applications are inventory-only' "$script"
          grep -Fq '53_responsiveness_v8.ps1" -Mode Apply' install.ps1
          grep -Fq '53_responsiveness_v8.ps1" -Mode Verify' install.ps1
      - name: Protect benchmark methodology
        shell: bash
        run: |
          set -euo pipefail
          if grep -nEi 'diskspd|winsat[[:space:]]+disk|fio|WriteAllBytes|fsutil[[:space:]]+file[[:space:]]+createnew|EmptyStandbyList' scripts/windows/42_benchmark.ps1; then
            echo 'V8 benchmark must stay lightweight and non-destructive.' >&2
            exit 1
          fi
          grep -Fq 'AutomaticManagedPagefile' scripts/windows/42_benchmark.ps1
          grep -Fq 'CommitPercent' scripts/windows/42_benchmark.ps1
          grep -Fq 'CurrentQueueLength' scripts/windows/42_benchmark.ps1

  audit-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Execute V8 non-mutating audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\windows\53_responsiveness_v8.ps1 -Mode Audit
          .\scripts\windows\42_benchmark.ps1 -Stage snapshot
      - name: Validate V8 reports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Get-Content -Raw .\reports\windows\v8-responsiveness.json | ConvertFrom-Json
          if ($report.Version -ne 'V8') { throw 'Unexpected V8 report version.' }
          if ($report.StartupAutomaticDisable -ne $false) { throw 'Startup automatic disable must remain off.' }
          if ($report.BackgroundGlobalDisable -ne $false) { throw 'Background global disable must remain off.' }
          $benchmark = Get-Content -Raw .\reports\windows\v4-benchmark-snapshot.json | ConvertFrom-Json
          if ($null -eq $benchmark.AutomaticManagedPagefile) { throw 'Pagefile telemetry missing.' }
          if ($null -eq $benchmark.CommitPercent) { throw 'Commit telemetry missing.' }
