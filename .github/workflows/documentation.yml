name: Documentation

on:
  push:
    branches: [main]
    paths:
      - README.md
      - CHANGELOG.md
      - docs/**
      - menu.ps1
      - install.ps1
      - update.ps1
      - scripts/**
      - config/**
      - manifests/**
      - .github/workflows/**
  pull_request:
    paths:
      - README.md
      - CHANGELOG.md
      - docs/**
      - menu.ps1
      - install.ps1
      - update.ps1
      - scripts/**
      - config/**
      - manifests/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  documentation-contract:
    name: Documentation canonique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned

      - name: Vérifier les documents canoniques
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            docs/README.md
            docs/00_ARCHITECTURE.md
            docs/00_VERSIONING.md
            docs/01_INSTALLATION_WINDOWS.md
            docs/02_BIOS_DRIVERS.md
            docs/03_STOCKAGE.md
            docs/04_OPTIMISATION_WINDOWS.md
            docs/05_DEFENDER_PERFORMANCE.md
            docs/06_WSL2.md
            docs/07_DEVOPS_STACK.md
            docs/08_APPLICATIONS.md
            docs/09_GAMING_OLED.md
            docs/10_BACKUP_RESTORE.md
            docs/11_VALIDATION.md
            docs/12_HARDWARE_QUALIFICATION.md
            docs/13_RUNBOOK_REINSTALLATION.md
            docs/14_ORCHESTRATION.md
            docs/15_MISES_A_JOUR.md
            docs/16_WSL2_GUIDE_COMPLET.md
            docs/17_CONTROL_CENTER.md
            docs/18_GUIDE_MAITRE.md
            docs/19_OPENCLAW_OPENROUTER_WINDOWS.md
            docs/20_RUNBOOK_OPERATIONNEL.md
            docs/21_REFERENCE_COMMANDES.md
            docs/22_TROUBLESHOOTING.md
            docs/23_SOURCES_DE_VERITE.md
            docs/24_CRITERES_ACCEPTATION.md
            docs/25_IDENTITE_STOCKAGE_ET_RECUPERATION.md
            docs/26_PREUVES_DRIFT_ET_RESTAURATION.md
            docs/GLOSSAIRE.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Documentation canonique absente ou vide: $file" >&2; exit 1; }
          done

      - name: Refuser les jalons historiques dans la documentation active
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [Path('README.md'), *sorted(Path('docs').glob('*.md'))]
          milestone = re.compile(r'\bV\d+\b', re.I)
          legacy_paths = (
              '00_storage_identity_v25.ps1',
              '00_storage_integrity_v24.ps1',
              '90_workstation_fingerprint_v26.ps1',
              '63_restore_drill_v26.ps1',
              '60_create_backup_v7.ps1',
              '61_validate_backup_v7.ps1',
              '62_restore_plan_v7.ps1',
              '11_validate_v3.ps1',
              '12_validate_v4.ps1',
              '13_validate_hardware_v5.ps1',
              '14_validate_wsl_v6.ps1',
              '40_v4_optimize.ps1',
              '53_responsiveness_v8.ps1',
              'config/backup/v7-policy.json',
              'config/hardware/target-v5.json',
              'config/hardware/symbiosis-v5.json',
              'config/updates/v11.json',
              'config/windows/v4/',
              'config/windows/v8/',
              'SkipV4RestorePoint',
          )
          errors = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              if milestone.search(text):
                  errors.append(f'{path}: ancien label Vxx encore visible')
              for old in legacy_paths:
                  if old in text:
                      errors.append(f'{path}: ancien chemin encore actif: {old}')
          if errors:
              raise SystemExit('\n'.join(errors))

      - name: Refuser les anciens chemins dans le code de CI actif
        shell: python
        run: |
          from pathlib import Path
          import re

          legacy = (
              '00_storage_identity_v25.ps1',
              '00_storage_integrity_v24.ps1',
              '90_workstation_fingerprint_v26.ps1',
              '63_restore_drill_v26.ps1',
              '60_create_backup_v7.ps1',
              '61_validate_backup_v7.ps1',
              '62_restore_plan_v7.ps1',
              '11_validate_v3.ps1',
              '12_validate_v4.ps1',
              '13_validate_hardware_v5.ps1',
              '14_validate_wsl_v6.ps1',
              '40_v4_optimize.ps1',
              '53_responsiveness_v8.ps1',
              'config/backup/v7-policy.json',
              'config/hardware/target-v5.json',
              'config/hardware/symbiosis-v5.json',
              'config/updates/v11.json',
              'config/windows/v4/',
              'config/windows/v8/',
              'tests/powershell/v26_contract.tests.ps1',
              'SkipV4RestorePoint',
          )
          errors = []
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text = path.read_text(encoding='utf-8')
              first = text.splitlines()[0] if text.splitlines() else ''
              if re.search(r'\bV\d+\b', first):
                  errors.append(f'{path}: nom affiché versionné: {first}')
              for old in legacy:
                  if old in text:
                      errors.append(f'{path}: référence obsolète: {old}')
          if errors:
              raise SystemExit('\n'.join(errors))

      - name: Vérifier le parcours canonique de première qualification
        shell: python
        run: |
          from pathlib import Path

          readme = Path('README.md').read_text(encoding='utf-8')
          runbook = Path('docs/20_RUNBOOK_OPERATIONNEL.md').read_text(encoding='utf-8')
          reference = Path('docs/21_REFERENCE_COMMANDES.md').read_text(encoding='utf-8')
          for path, text in ((Path('README.md'), readme), (Path('docs/20_RUNBOOK_OPERATIONNEL.md'), runbook), (Path('docs/21_REFERENCE_COMMANDES.md'), reference)):
              if '00_storage_identity.ps1' not in text:
                  raise SystemExit(f'{path}: commande canonique identité stockage absente')

          order = [
              '.\\install.ps1 -Mode Audit',
              '00_storage_identity.ps1 -Mode Audit',
              '-Mode Record',
              '00_storage_identity.ps1 -Mode Verify',
              '.\\install.ps1 -Mode Apply -FullInstall -PlanOnly',
              '.\\install.ps1 -Mode Apply -FullInstall',
          ]
          positions = []
          start = 0
          for needle in order:
              pos = runbook.find(needle, start)
              if pos < 0:
                  raise SystemExit(f'docs/20_RUNBOOK_OPERATIONNEL.md: étape absente ou désordonnée: {needle}')
              positions.append(pos)
              start = pos + len(needle)
          if positions != sorted(positions):
              raise SystemExit('Le parcours de première qualification est désordonné.')

      - name: Vérifier les paramètres publics de l’orchestrateur
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\install.ps1'), [ref]$tokens, [ref]$errors)
          if (@($errors).Count -gt 0) { throw ($errors.Message -join '; ') }
          $parameterNames = @($ast.ParamBlock.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath })
          foreach ($required in @(
            'Mode','WslProfile','OptimizationProfiles','Distribution','WslInstallLocation','WslUser',
            'InstallDevOps','ValidateDevOps','ValidateWsl','ValidateHardware','SkipFoundationRestorePoint',
            'BackupAction','BackupTargetDrive','AllowNonUsbBackupTarget','SkipBackupRestorePoint',
            'FullInstall','PlanOnly','NonInteractive','Yes'
          )) {
            if ($parameterNames -notcontains $required) { throw "Paramètre public attendu absent de install.ps1: $required" }
          }
          foreach ($forbidden in @('SkipV4RestorePoint')) {
            if ($parameterNames -contains $forbidden) { throw "Paramètre historique réintroduit: $forbidden" }
          }

      - name: Vérifier la synchronisation du catalogue applicatif
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path('manifests/winget/apps-core.json').read_text(encoding='utf-8'))
          documentation = Path('docs/08_APPLICATIONS.md').read_text(encoding='utf-8')

          def section(start, end):
              if start not in documentation or end not in documentation:
                  raise SystemExit(f'Section applicative absente: {start} / {end}')
              return documentation.split(start, 1)[1].split(end, 1)[0]

          automatic_section = section('## Applications automatiques actuelles', '## Applications volontairement manuelles')
          manual_section = section('## Applications volontairement manuelles', '## Installer ou réparer uniquement les logiciels')
          documented_automatic = {
              (name.strip(), winget_id.strip())
              for name, winget_id in re.findall(r'^\|\s*([^|]+?)\s*\|\s*`([^`]+)`\s*\|\s*$', automatic_section, flags=re.MULTILINE)
          }
          documented_manual = {
              name.strip()
              for name in re.findall(r'^\|\s*([^|]+?)\s*\|\s*`autoInstall=false`\s*\|\s*$', manual_section, flags=re.MULTILINE)
          }
          expected_automatic = {(app['name'], app['wingetId']) for app in manifest['apps'] if app['autoInstall']}
          expected_manual = {app['name'] for app in manifest['apps'] if not app['autoInstall']}
          if documented_automatic != expected_automatic:
              raise SystemExit('Catalogue automatique désynchronisé.')
          if documented_manual != expected_manual:
              raise SystemExit('Catalogue manuel désynchronisé.')

      - name: Vérifier le contrat terminal et la frontière OpenClaw
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md docs/00_ARCHITECTURE.md docs/07_DEVOPS_STACK.md docs/18_GUIDE_MAITRE.md docs/19_OPENCLAW_OPENROUTER_WINDOWS.md docs/20_RUNBOOK_OPERATIONNEL.md docs/24_CRITERES_ACCEPTATION.md; do
            grep -Fq 'Windows Terminal' "$file"
            grep -Fq 'PowerShell 7 - DevOps' "$file"
            grep -Fq 'Ubuntu - DevOps' "$file"
          done
          test -s config/windows-terminal/profiles.fragment.json
          test -s config/windows-terminal/actions.json
          test -s config/windows-terminal/starship.windows.toml
          test -s scripts/windows/31_windows_terminal.ps1
          test ! -e config/wezterm/wezterm.lua
          test ! -e scripts/windows/31_wezterm.ps1
          if grep -REi 'OpenClaw|openclaw|clawops|OPENCLAW_' config/windows-terminal scripts/windows/31_windows_terminal.ps1; then
            echo 'La configuration terminal de la workstation contient une intégration projet externe.' >&2
            exit 1
          fi
          test ! -e config/openclaw/control-plane.json
          test ! -e scripts/bootstrap/15_openclaw_ai.ps1
          grep -Fq "n'installe pas, ne configure pas, ne met pas à jour et ne valide pas OpenClaw/OpenRouter" README.md

      - name: Vérifier les liens Markdown locaux
        shell: python
        run: |
          from pathlib import Path
          import re
          from urllib.parse import unquote

          files = [Path('README.md'), *sorted(Path('docs').glob('*.md'))]
          broken = []
          pattern = re.compile(r'\[[^\]]*\]\(([^)]+)\)')
          for path in files:
              text = path.read_text(encoding='utf-8')
              for target in pattern.findall(text):
                  target = target.strip().split('#', 1)[0]
                  if not target or '://' in target or target.startswith('mailto:'):
                      continue
                  resolved = (path.parent / unquote(target)).resolve()
                  if not resolved.exists():
                      broken.append(f'{path}: {target}')
          if broken:
              raise SystemExit('Liens Markdown locaux cassés:\n' + '\n'.join(broken))

      - name: Vérifier l’identité et la navigation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'workstation DevOps/Ops reproductible' README.md
          grep -Fq 'workstation-as-code' README.md
          grep -Fq 'Ubuntu 26.04' README.md
          grep -Fq 'E:\WSL\Ubuntu-DevOps' README.md
          grep -Fq '20_RUNBOOK_OPERATIONNEL.md' README.md
          grep -Fq '24_CRITERES_ACCEPTATION.md' README.md
          for file in 20_RUNBOOK_OPERATIONNEL.md 21_REFERENCE_COMMANDES.md 22_TROUBLESHOOTING.md 23_SOURCES_DE_VERITE.md 24_CRITERES_ACCEPTATION.md; do
            grep -Fq "$file" docs/README.md
          done
