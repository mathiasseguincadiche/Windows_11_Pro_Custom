name: Pending reboot control V23

on:
  pull_request:
    paths:
      - '.github/workflows/pending-reboot-v23.yml'
      - 'menu.ps1'
      - 'install.ps1'
      - 'update.ps1'
      - 'scripts/bootstrap/00_preflight.ps1'
      - 'scripts/bootstrap/01_machine_state.ps1'
      - 'scripts/bootstrap/02_physical_readiness.ps1'
      - 'scripts/bootstrap/02_foundation.ps1'
      - 'scripts/core/reboot-state.psm1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pending-reboot-v23.yml'
      - 'menu.ps1'
      - 'install.ps1'
      - 'update.ps1'
      - 'scripts/bootstrap/00_preflight.ps1'
      - 'scripts/bootstrap/01_machine_state.ps1'
      - 'scripts/bootstrap/02_physical_readiness.ps1'
      - 'scripts/bootstrap/02_foundation.ps1'
      - 'scripts/core/reboot-state.psm1'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned

      - name: Enforce fail-closed reboot contract
        shell: bash
        run: |
          set -euo pipefail
          module='scripts/core/reboot-state.psm1'
          preflight='scripts/bootstrap/00_preflight.ps1'
          machine='scripts/bootstrap/01_machine_state.ps1'
          readiness='scripts/bootstrap/02_physical_readiness.ps1'
          menu='menu.ps1'
          install='install.ps1'
          update='update.ps1'

          test -f "$module"
          grep -Fq 'Component Based Servicing\RebootPending' "$module"
          grep -Fq 'WindowsUpdate\Auto Update\RebootRequired' "$module"
          grep -Fq 'PendingFileRenameOperations' "$module"
          grep -Fq 'Get-WpcPendingRebootState' "$module"
          grep -Fq 'Test-WpcRebootRequiredMessage' "$module"
          grep -Fq 'BlockingReasons' "$module"
          grep -Fq 'AdvisoryReasons' "$module"
          grep -Fq 'PendingFileRenameOperationsCount' "$module"
          grep -Fq 'Pending = ($blockingReasons.Count -gt 0)' "$module"

          grep -Fq 'scripts\core\reboot-state.psm1' "$preflight"
          grep -Fq "Import-Module \$rebootStateModule -Force" "$preflight"
          grep -Fq "\$pendingReboot = Get-WpcPendingRebootState" "$preflight"
          grep -Fq 'AllowPendingReboot' "$preflight"
          grep -Fq "StrictPhysicalReadiness -or -not \$AllowPendingReboot" "$preflight"
          grep -Fq 'ne contourne jamais StrictPhysicalReadiness' "$preflight"
          if grep -Fq 'function Get-PendingRebootState' "$preflight"; then
            echo 'Preflight must use the shared reboot-state module.' >&2
            exit 1
          fi

          if grep -Fq 'AllowPendingReboot' "$install"; then
            echo 'Apply/Verify orchestrator must never bypass pending reboot.' >&2
            exit 1
          fi

          grep -Fq 'scripts\core\reboot-state.psm1' "$menu"
          grep -Fq 'Invoke-WpcPendingRebootGate' "$menu"
          grep -Fq 'Test-WpcRebootRequiredMessage' "$menu"
          grep -Fq 'LastActionRequiresReboot' "$menu"
          grep -Fq 'Restart-Computer -Force' "$menu"
          grep -Fq 'Apres reboot, relance simplement Installation complete' "$menu"

          grep -Fq 'scripts\core\reboot-state.psm1' "$machine"
          grep -Fq 'Get-WpcPendingRebootState' "$machine"
          grep -Fq 'scripts\core\reboot-state.psm1' "$readiness"
          grep -Fq 'Get-WpcPendingRebootState' "$readiness"
          grep -Fq 'PendingFileRenameOperations non bloquant' "$readiness"
          grep -Fq 'scripts\core\reboot-state.psm1' "$update"
          grep -Fq 'Get-WpcPendingRebootState' "$update"

          gate_line=$(grep -n "Invoke-WpcPendingRebootGate -Context 'avant l installation complete'" "$menu" | head -n1 | cut -d: -f1)
          install_line=$(grep -n "DisplayName 'Installation complete'" "$menu" | head -n1 | cut -d: -f1)
          if [ "$gate_line" -ge "$install_line" ]; then
            echo 'Pending reboot gate must run before FullInstall.' >&2
            exit 1
          fi

          duplicate_detection='Get-ItemProperty(Value)?[^[:cntrl:]]*PendingFileRenameOperations|Session Manager[^[:cntrl:]]*PendingFileRenameOperations'
          if grep -InE "$duplicate_detection" "$machine" "$readiness" "$update"; then
            echo 'Consumers must not reimplement PendingFileRenameOperations reboot classification.' >&2
            exit 1
          fi

          forbidden='Remove-Item[^[:cntrl:]]*RebootPending|Remove-ItemProperty[^[:cntrl:]]*PendingFileRenameOperations|reg(\.exe)?[[:space:]]+delete[^[:cntrl:]]*(RebootPending|RebootRequired)'
          if grep -InE "$forbidden" "$module" "$menu" "$preflight" "$machine" "$readiness" "$update"; then
            echo 'Pending reboot state must never be cleared by registry deletion.' >&2
            exit 1
          fi

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned

      - name: Parse V23 PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.\menu.ps1',
            '.\update.ps1',
            '.\scripts\bootstrap\00_preflight.ps1',
            '.\scripts\bootstrap\01_machine_state.ps1',
            '.\scripts\bootstrap\02_physical_readiness.ps1',
            '.\scripts\core\reboot-state.psm1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) {
              $errors | ForEach-Object { Write-Host "$path $($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber): $($_.Message)" }
              throw "$path parse failed."
            }
          }

      - name: Exercise reboot-state classification without registry mutation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $module = Import-Module .\scripts\core\reboot-state.psm1 -Force -PassThru

          $state = Get-WpcPendingRebootState
          if ($state.Pending -isnot [bool]) { throw 'Pending must be a Boolean.' }
          if ($null -eq $state.Reasons) { throw 'Reasons collection missing.' }
          if ($null -eq $state.AdvisoryReasons) { throw 'AdvisoryReasons collection missing.' }
          Write-Host "Hosted runner pending reboot=$($state.Pending) reasons=$($state.Reasons -join ',') advisory=$($state.AdvisoryReasons -join ',')"

          $pfroOnly = & $module {
            New-WpcPendingRebootState `
              -CbsPending:$false `
              -WindowsUpdatePending:$false `
              -PendingFileRenameOperations @('\??\C:\Temp\stale.tmp', '\??\C:\Temp\target.tmp')
          }
          if ($pfroOnly.Pending) { throw 'PendingFileRenameOperations alone must not block convergence.' }
          if (-not $pfroOnly.Advisory) { throw 'PendingFileRenameOperations alone must remain visible as advisory.' }
          if ($pfroOnly.AdvisoryReasons -notcontains 'PendingFileRenameOperations') { throw 'PFRO advisory reason missing.' }
          if ($pfroOnly.PendingFileRenameOperationsCount -ne 2) { throw 'PFRO entry count mismatch.' }

          $cbsOnly = & $module {
            New-WpcPendingRebootState -CbsPending:$true -WindowsUpdatePending:$false -PendingFileRenameOperations @()
          }
          if (-not $cbsOnly.Pending) { throw 'CBS RebootPending must remain blocking.' }
          if ($cbsOnly.Reasons -notcontains 'CBS') { throw 'CBS blocking reason missing.' }

          $windowsUpdateOnly = & $module {
            New-WpcPendingRebootState -CbsPending:$false -WindowsUpdatePending:$true -PendingFileRenameOperations @()
          }
          if (-not $windowsUpdateOnly.Pending) { throw 'Windows Update RebootRequired must remain blocking.' }
          if ($windowsUpdateOnly.Reasons -notcontains 'WindowsUpdate') { throw 'Windows Update blocking reason missing.' }

          foreach ($message in @(
            'Un redémarrage Windows est en attente (CBS).',
            'REDÉMARRAGE REQUIS: fondations WSL/VMP activées avec succès.',
            'reboot pending'
          )) {
            if (-not (Test-WpcRebootRequiredMessage -Message $message)) {
              throw "Expected reboot classification for: $message"
            }
          }
          if (Test-WpcRebootRequiredMessage -Message 'Erreur WinGet générique') {
            throw 'Generic errors must not be classified as reboot-required.'
          }

      - name: Preserve FullInstall DryRun routing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & .\menu.ps1 -Choice 1 -DryRun -NoPause -NoClear *>&1 | Out-String
          if (-not $output.Contains('install.ps1')) { throw 'FullInstall route disappeared.' }
          if (-not $output.Contains('-FullInstall')) { throw 'FullInstall switch disappeared.' }
          if (-not $output.Contains('[DRY-RUN]')) { throw 'DryRun must remain non-mutating.' }
