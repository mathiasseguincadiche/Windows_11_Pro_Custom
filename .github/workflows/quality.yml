name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $file = $_
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            foreach ($parseError in @($parseErrors)) {
              $failed = $true
              $line = $parseError.Extent.StartLineNumber
              $column = $parseError.Extent.StartColumnNumber
              Write-Host "PARSE_ERROR $($file.FullName) line=$line col=$column message=$($parseError.Message)"
              Write-Host "::error file=$($file.FullName),line=$line,col=$column::$($parseError.Message)"
            }
          }
          if ($failed) { exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error)
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize
            exit 1
          }
      - name: Audit V4 profiles on Windows
        shell: pwsh
        run: |
          foreach ($profile in @('standard', 'privacy', 'gaming', 'optional')) {
            Write-Host "Auditing V4 profile: $profile"
            & .\scripts\windows\40_v4_optimize.ps1 -Mode Audit -Profile $profile
          }

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse Bash files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          mapfile -d '' files < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if (( ${#files[@]} > 0 )); then
            shellcheck "${files[@]}"
          fi

  structured-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.json' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            jq empty "$file"
          done
      - name: Validate V4 profile schema
        shell: bash
        run: |
          set -euo pipefail
          for file in config/windows/v4/*.json; do
            jq -e '
              (.profile | type == "string") and
              (.description | type == "string") and
              (.rebootRecommended | type == "boolean") and
              (.registry | type == "array") and
              (.services | type == "array") and
              (all(.registry[]?; (.name|type=="string") and (.path|type=="string") and (.property|type=="string") and ((.type=="DWord") or (.type=="String")))) and
              (all(.services[]?; (.name|type=="string") and ((.startupType=="Disabled") or (.startupType=="Manual") or (.startupType=="Automatic"))))
            ' "$file" >/dev/null
          done
          jq -e '.execution == "reference-only"' config/winutil/mathias-winutil.json >/dev/null
      - name: Validate WezTerm Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.4
          luac -p config/wezterm/wezterm.lua

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          version='1.7.12'
          expected='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" -o actionlint.tar.gz
          echo "${expected}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: Lint workflows
        run: actionlint .github/workflows/*.yml

  safety-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject destructive Windows operations
        shell: bash
        run: |
          set -euo pipefail
          forbidden='Format-Volume|Clear-Disk|Initialize-Disk|Remove-Partition|DisableRealtimeMonitoring.*true'
          if grep -RInE "$forbidden" scripts --include='*.ps1'; then
            echo 'A destructive or Defender-disabling command was detected in executable PowerShell.' >&2
            exit 1
          fi
          echo 'Base safety guard: OK'
      - name: Enforce V4 safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          profiles=(config/windows/v4/*.json)
          forbidden_services='^(SharedAccess|StorSvc|wuauserv|WinDefend|mpssvc|vmcompute|hns)$'
          if jq -r '.services[]?.name' "${profiles[@]}" | grep -E "$forbidden_services"; then
            echo 'A forbidden Windows/WSL/security service is targeted by a V4 profile.' >&2
            exit 1
          fi
          if jq -r '.registry[]?.path' "${profiles[@]}" | grep -Ei 'Windows Defender|WindowsUpdate|WindowsFirewall'; then
            echo 'A forbidden security/update Registry path is targeted by a V4 profile.' >&2
            exit 1
          fi
          if [[ "$(jq '.services | length' config/windows/v4/standard.json)" != '0' ]]; then
            echo 'The default V4 standard profile must not modify services.' >&2
            exit 1
          fi
          if grep -RInE 'Remove-AppxPackage|Disable-WindowsOptionalFeature|winget[[:space:]]+uninstall' scripts/windows/4*.ps1; then
            echo 'V4 optimization scripts must not remove Windows components or apps.' >&2
            exit 1
          fi
          echo 'V4 safety boundaries: OK'
