name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            foreach ($parseError in @($parseErrors)) {
              $failed = $true
              $line = $parseError.Extent.StartLineNumber
              $column = $parseError.Extent.StartColumnNumber
              Write-Host "::error file=$($_.FullName),line=$line,col=$column::$($parseError.Message)"
            }
          }
          if ($failed) { exit 1 }

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse Bash files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          mapfile -d '' files < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if (( ${#files[@]} > 0 )); then
            shellcheck "${files[@]}"
          fi

  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.json' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            jq empty "$file"
          done
