name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $file = $_
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            foreach ($parseError in @($parseErrors)) {
              $failed = $true
              $line = $parseError.Extent.StartLineNumber
              $column = $parseError.Extent.StartColumnNumber
              Write-Host "PARSE_ERROR $($file.FullName) line=$line col=$column message=$($parseError.Message)"
              Write-Host "::error file=$($file.FullName),line=$line,col=$column::$($parseError.Message)"
            }
          }
          if ($failed) { exit 1 }
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error)
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize
            exit 1
          }
      - name: Audit Windows optimization profiles
        shell: pwsh
        run: |
          foreach ($profile in @('standard', 'privacy', 'gaming', 'optional')) {
            Write-Host "Auditing optimization profile: $profile"
            & .\scripts\windows\40_v4_optimize.ps1 -Mode Audit -Profile $profile
          }
      - name: Windows PowerShell 5.1 hardware smoke test
        shell: powershell
        run: |
          Write-Host "Windows PowerShell: $($PSVersionTable.PSVersion)"
          Get-Content -Raw .\config\hardware\target-v5.json | ConvertFrom-Json | Out-Null
          & .\scripts\windows\51_hardware_manual_checks.ps1 -Mode Show

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Parse Bash files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          mapfile -d '' files < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if (( ${#files[@]} > 0 )); then
            shellcheck "${files[@]}"
          fi

  structured-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.json' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            jq empty "$file"
          done
      - name: Validate optimization profile schema
        shell: bash
        run: |
          set -euo pipefail
          for file in config/windows/v4/*.json; do
            jq -e '
              (.profile | type == "string") and
              (.description | type == "string") and
              (.rebootRecommended | type == "boolean") and
              (.registry | type == "array") and
              (.services | type == "array") and
              (all(.registry[]?; (.name|type=="string") and (.path|type=="string") and (.property|type=="string") and ((.type=="DWord") or (.type=="String")))) and
              (all(.services[]?; (.name|type=="string") and ((.startupType=="Disabled") or (.startupType=="Manual") or (.startupType=="Automatic"))))
            ' "$file" >/dev/null
          done
          jq -e '.execution == "reference-only"' config/winutil/mathias-winutil.json >/dev/null
      - name: Validate hardware target schema
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            (.version == "V5") and
            (.cpu.nameContains | type == "string") and
            (.cpu.cores == 8) and
            (.cpu.threads == 16) and
            (.memory.minimumBytes | type == "number") and
            (.memory.targetConfiguredClockMHz == 6000) and
            (.gpu.nameRegex | type == "string") and
            (.motherboard.manufacturerContains | type == "string") and
            (.motherboard.productContains | type == "string") and
            (.storage.minimumCount == 2) and
            (.display.width == 2560) and
            (.display.height == 1440) and
            (.display.minimumRefreshHz >= 239) and
            (.manualChecks | type == "array") and
            (.manualChecks | length == 8)
          ' config/hardware/target-v5.json >/dev/null
          jq -e '.network.wifiDeviceRegex | test("Wi-Fi 7|FastConnect 7800|NCM865")' config/hardware/symbiosis-v5.json >/dev/null
      - name: Validate WSL profiles and remote tooling
        shell: bash
        run: |
          set -euo pipefail
          standard='config/wsl/standard.wslconfig'
          heavy='config/wsl/lab-heavy.wslconfig'
          nat='config/wsl/nat-fallback.wslconfig'

          grep -qx 'memory=20GB' "$standard"
          grep -qx 'processors=8' "$standard"
          grep -qx 'swap=8GB' "$standard"
          grep -Fqx 'swapFile=D:\\WSL\\swap\\wsl-swap.vhdx' "$standard"
          grep -qx 'networkingMode=mirrored' "$standard"

          grep -qx 'memory=28GB' "$heavy"
          grep -qx 'processors=12' "$heavy"
          grep -qx 'swap=12GB' "$heavy"
          grep -Fqx 'swapFile=D:\\WSL\\swap\\wsl-swap.vhdx' "$heavy"
          grep -qx 'networkingMode=mirrored' "$heavy"

          grep -qx 'memory=20GB' "$nat"
          grep -qx 'processors=8' "$nat"
          grep -qx 'swap=8GB' "$nat"
          grep -qx 'networkingMode=nat' "$nat"

          for file in "$standard" "$heavy" "$nat"; do
            grep -qx 'dnsTunneling=true' "$file"
            grep -qx 'firewall=true' "$file"
            grep -qx 'autoProxy=true' "$file"
            grep -qx 'nestedVirtualization=false' "$file"
            grep -qx 'autoMemoryReclaim=gradual' "$file"
            grep -qx 'sparseVhd=true' "$file"
          done

          jq -e '.apps[] | select(.wingetId == "Microsoft.PowerShell" and .autoInstall == true)' manifests/winget/apps-core.json >/dev/null
          grep -qx 'ms-vscode-remote.remote-ssh' config/vscode/extensions.txt
          grep -qx 'Natizyskunk.sftp' config/vscode/extensions.txt
          grep -qx 'Natizyskunk.sftp' config/vscode/extensions-wsl.txt
      - name: Validate backup policy and wiring
        shell: bash
        run: |
          set -euo pipefail
          policy='config/backup/v7-policy.json'
          jq -e '
            (.version == "V7") and
            (.systemVolumes == ["C:", "D:"]) and
            (.minimumTargetFreeGB >= 100) and
            (.requireUsbTargetByDefault == true) and
            (.wslDistribution == "Ubuntu") and
            (.wslExportFormat == "vhdx") and
            (.hashAlgorithm == "SHA256") and
            (.restoreTestDistribution == "Ubuntu-Restore-V7") and
            (.destructiveRestoreAutomation == false) and
            (.recoveryMediaRecommended == true)
          ' "$policy" >/dev/null
          test -f scripts/backup/60_create_backup_v7.ps1
          test -f scripts/backup/61_validate_backup_v7.ps1
          test -f scripts/backup/62_restore_plan_v7.ps1
          test -f docs/10_BACKUP_RESTORE.md
          grep -q "ValidateSet('None', 'Create', 'Verify', 'RestorePlan')" install.ps1
          grep -q 'scripts\\backup\\60_create_backup_v7.ps1' install.ps1
          grep -q 'scripts\\backup\\61_validate_backup_v7.ps1' install.ps1
          grep -q 'scripts\\backup\\62_restore_plan_v7.ps1' install.ps1
          grep -q 'wbadminVersionIdentifier' scripts/backup/60_create_backup_v7.ps1
          grep -q 'wbadminVersionIdentifier' scripts/backup/61_validate_backup_v7.ps1
          grep -q 'wbadminVersionIdentifier' scripts/backup/63_restore_drill_v26.ps1
      - name: Validate WezTerm Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.4
          luac -p config/wezterm/wezterm.lua

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Reject mutable action references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^[[:space:]]*uses:[[:space:]]+[^[:space:]#]+@(v[0-9]+|main|master|latest)([[:space:]#]|$)' .github/workflows; then
            echo 'Every GitHub Action must be pinned to an immutable commit SHA.' >&2
            exit 1
          fi
      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          version='1.7.12'
          expected='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 120 -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          echo "${expected}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: Lint workflows
        run: actionlint .github/workflows/*.yml

  safety-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Reject destructive Windows operations
        shell: bash
        run: |
          set -euo pipefail
          forbidden='Format-Volume|Clear-Disk|Initialize-Disk|Remove-Partition|DisableRealtimeMonitoring.*true'
          if grep -RInE "$forbidden" scripts --include='*.ps1'; then
            echo 'A destructive or Defender-disabling command was detected in executable PowerShell.' >&2
            exit 1
          fi
          echo 'Base safety guard: OK'
      - name: Enforce optimization safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          profiles=(config/windows/v4/*.json)
          forbidden_services='^(SharedAccess|StorSvc|wuauserv|WinDefend|mpssvc|vmcompute|hns)$'
          if jq -r '.services[]?.name' "${profiles[@]}" | grep -E "$forbidden_services"; then
            echo 'A forbidden Windows/WSL/security service is targeted by an optimization profile.' >&2
            exit 1
          fi
          if jq -r '.registry[]?.path' "${profiles[@]}" | grep -Ei 'Windows Defender|WindowsUpdate|WindowsFirewall'; then
            echo 'A forbidden security/update Registry path is targeted by an optimization profile.' >&2
            exit 1
          fi
          if [[ "$(jq '.services | length' config/windows/v4/standard.json)" != '0' ]]; then
            echo 'The default standard optimization profile must not modify services.' >&2
            exit 1
          fi
          if grep -RInE 'Remove-AppxPackage|Disable-WindowsOptionalFeature|winget[[:space:]]+uninstall' scripts/windows/4*.ps1; then
            echo 'Optimization scripts must not remove Windows components or apps.' >&2
            exit 1
          fi
          echo 'Optimization safety boundaries: OK'
      - name: Enforce observational hardware policy
        shell: bash
        run: |
          set -euo pipefail
          forbidden='Set-Service|New-ItemProperty|Set-ItemProperty|Remove-ItemProperty|Format-Volume|Clear-Disk|Initialize-Disk|Set-Disk|Set-Partition|Resize-Partition|Optimize-Volume|Set-Storage|Set-MpPreference|bcdedit|RyzenMaster'
          if grep -InE "$forbidden" scripts/windows/50_hardware_inventory.ps1 scripts/windows/51_hardware_manual_checks.ps1 scripts/bootstrap/13_validate_hardware_v5.ps1; then
            echo 'Hardware qualification must remain observational and must not tune hardware automatically.' >&2
            exit 1
          fi
          echo 'Observational hardware policy: OK'
      - name: Enforce WSL safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(memory=(3[3-9]|[4-9][0-9])GB|processors=(1[3-9]|[2-9][0-9])|swap=0|nestedVirtualization=true)$' config/wsl/*.wslconfig; then
            echo 'Unsafe or oversized WSL resource setting detected.' >&2
            exit 1
          fi
          if grep -RInE 'autoMemoryReclaim=disabled|firewall=false|dnsTunneling=false' config/wsl/*.wslconfig; then
            echo 'A required WSL memory/network safety setting was disabled.' >&2
            exit 1
          fi
          echo 'WSL safety boundaries: OK'
      - name: Enforce backup and restore safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.destructiveRestoreAutomation == false' config/backup/v7-policy.json >/dev/null
          if grep -InE 'sysrecovery|start[[:space:]]+recovery|--unregister|-recreateDisks|Format-Volume|Clear-Disk|Initialize-Disk|Remove-Partition' scripts/backup/60_create_backup_v7.ps1 scripts/backup/61_validate_backup_v7.ps1; then
            echo 'Backup create/validate scripts must never contain destructive restore or disk-recreation operations.' >&2
            exit 1
          fi
          if grep -InE 'Invoke-Expression|Start-Process|^[[:space:]]*&' scripts/backup/62_restore_plan_v7.ps1; then
            echo 'Restore plan must remain instruction-only and must not execute native restore commands.' >&2
            exit 1
          fi
          if grep -InE "['\"]-quiet['\"]" scripts/backup/60_create_backup_v7.ps1; then
            echo 'The first Golden Backup must retain wbadmin operator confirmation; the wbadmin -quiet argument is forbidden.' >&2
            exit 1
          fi
          echo 'Backup and restore safety boundaries: OK'
