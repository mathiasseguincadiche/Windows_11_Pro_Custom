name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Validate PowerShell 7 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $contract = Get-Content -Raw .\config\powershell\runtime.json | ConvertFrom-Json
          if ($PSVersionTable.PSEdition -ne 'Core') { throw "PowerShell Core required; detected $($PSVersionTable.PSEdition)." }
          if ([version]$PSVersionTable.PSVersion -lt [version]$contract.minimumVersion) { throw "PowerShell $($contract.minimumVersion)+ required; detected $($PSVersionTable.PSVersion)." }
          if (-not [Environment]::Is64BitProcess) { throw 'x64 PowerShell process required.' }
          Import-Module .\scripts\core\powershell-runtime.psm1 -Force
          $fact = Assert-WpcPowerShellRuntime -MinimumVersion ([version]$contract.minimumVersion) -RequireWindows -PassThru
          Write-Host "Validated: PowerShell $($fact.Version) | $($fact.Edition) | $($fact.ExecutableName) | x64=$($fact.Is64BitProcess)"

      - name: Parse PowerShell files and modules
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in @('.ps1', '.psm1') } | ForEach-Object {
            $file = $_
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            foreach ($parseError in @($parseErrors)) {
              $failed = $true
              $line = $parseError.Extent.StartLineNumber
              $column = $parseError.Extent.StartColumnNumber
              Write-Host "::error file=$($file.FullName),line=$line,col=$column::$($parseError.Message)"
            }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error)
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize
            exit 1
          }

      - name: Audit Windows optimization profiles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($profile in @('standard', 'privacy', 'gaming', 'optional')) {
            Write-Host "Auditing optimization profile: $profile"
            & .\scripts\windows\40_optimize.ps1 -Mode Audit -Profile $profile
          }

      - name: PowerShell 7 hardware contract smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "PowerShell 7: $($PSVersionTable.PSVersion)"
          Get-Content -Raw .\config\hardware\target.json | ConvertFrom-Json | Out-Null
          & .\scripts\windows\51_hardware_manual_checks.ps1 -Mode Show

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Parse Bash files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null 2>&1 || { echo 'ShellCheck unavailable.' >&2; exit 1; }
          mapfile -d '' files < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          if (( ${#files[@]} > 0 )); then shellcheck "${files[@]}"; fi

  structured-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Validate every JSON document
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.json' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do jq empty "$file"; done

      - name: Validate PowerShell runtime policy
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            (.schemaVersion == 1) and
            (.edition == "Core") and
            (.minimumVersion == "7.6.4") and
            (.architecture == "x64") and
            (.executable == "pwsh.exe") and
            (.windowsPowerShellSupported == false)
          ' config/powershell/runtime.json >/dev/null

      - name: Validate canonical optimization profiles
        shell: bash
        run: |
          set -euo pipefail
          profiles=(config/windows/optimization/*.json)
          test "${#profiles[@]}" -eq 4
          for file in "${profiles[@]}"; do
            jq -e '
              (.profile | type == "string") and
              (.description | type == "string") and
              (.rebootRecommended | type == "boolean") and
              (.registry | type == "array") and
              (.services | type == "array") and
              (all(.registry[]?; (.name|type=="string") and (.path|type=="string") and (.property|type=="string") and ((.type=="DWord") or (.type=="String")))) and
              (all(.services[]?; (.name|type=="string") and ((.startupType=="Disabled") or (.startupType=="Manual") or (.startupType=="Automatic"))))
            ' "$file" >/dev/null
          done
          jq -e '.execution == "reference-only"' config/winutil/mathias-winutil.json >/dev/null

      - name: Validate canonical hardware schema
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            (.schemaVersion == 1) and
            (.symbiosisPolicy == "config/hardware/symbiosis.json") and
            (.cpu.nameContains | type == "string") and
            (.cpu.cores == 8) and
            (.cpu.threads == 16) and
            (.memory.minimumBytes | type == "number") and
            (.memory.targetConfiguredClockMHz == 6000) and
            (.gpu.nameRegex | type == "string") and
            (.motherboard.manufacturerContains | type == "string") and
            (.motherboard.productContains | type == "string") and
            (.storage.minimumCount == 2) and
            (.display.width == 2560) and
            (.display.height == 1440) and
            (.display.minimumRefreshHz >= 239) and
            (.manualChecks | type == "array") and
            (.manualChecks | length == 8)
          ' config/hardware/target.json >/dev/null
          jq -e '(.schemaVersion == 1) and (.network.wifiDeviceRegex | test("Wi-Fi 7|FastConnect 7800|NCM865"))' config/hardware/symbiosis.json >/dev/null

      - name: Validate WSL profiles and remote tooling
        shell: bash
        run: |
          set -euo pipefail
          standard='config/wsl/standard.wslconfig'
          heavy='config/wsl/lab-heavy.wslconfig'
          nat='config/wsl/nat-fallback.wslconfig'
          grep -qx 'memory=20GB' "$standard"
          grep -qx 'processors=8' "$standard"
          grep -qx 'swap=8GB' "$standard"
          grep -Fqx 'swapFile=E:\\WSL\\swap\\wsl-swap.vhdx' "$standard"
          grep -qx 'networkingMode=mirrored' "$standard"
          grep -qx 'memory=28GB' "$heavy"
          grep -qx 'processors=12' "$heavy"
          grep -qx 'swap=12GB' "$heavy"
          grep -Fqx 'swapFile=E:\\WSL\\swap\\wsl-swap.vhdx' "$heavy"
          grep -qx 'networkingMode=mirrored' "$heavy"
          grep -qx 'memory=20GB' "$nat"
          grep -qx 'processors=8' "$nat"
          grep -qx 'swap=8GB' "$nat"
          grep -qx 'networkingMode=nat' "$nat"
          for file in "$standard" "$heavy" "$nat"; do
            grep -qx 'dnsTunneling=true' "$file"
            grep -qx 'firewall=true' "$file"
            grep -qx 'autoProxy=true' "$file"
            grep -qx 'nestedVirtualization=false' "$file"
            grep -qx 'autoMemoryReclaim=gradual' "$file"
            grep -qx 'sparseVhd=true' "$file"
          done
          jq -e '.apps[] | select(.wingetId == "Microsoft.PowerShell" and .autoInstall == true)' manifests/winget/apps-core.json >/dev/null
          grep -qx 'ms-vscode-remote.remote-ssh' config/vscode/extensions.txt
          grep -qx 'Natizyskunk.sftp' config/vscode/extensions.txt
          grep -qx 'Natizyskunk.sftp' config/vscode/extensions-wsl.txt

      - name: Validate canonical backup policy and wiring
        shell: bash
        run: |
          set -euo pipefail
          policy='config/backup/policy.json'
          jq -e '
            (.schemaVersion == 1) and
            (.systemVolumes == ["C:", "E:"]) and
            (.minimumTargetFreeGB >= 100) and
            (.requireUsbTargetByDefault == true) and
            (.wslDistribution == "Ubuntu") and
            (.wslExportFormat == "vhdx") and
            (.hashAlgorithm == "SHA256") and
            (.destructiveRestoreAutomation == false) and
            (.recoveryMediaRecommended == true)
          ' "$policy" >/dev/null
          for file in scripts/backup/60_create_backup.ps1 scripts/backup/61_validate_backup.ps1 scripts/backup/62_restore_plan.ps1 scripts/backup/63_restore_drill.ps1; do test -f "$file"; done
          grep -Fq "ValidateSet('None', 'Create', 'Verify', 'RestorePlan')" install.ps1
          grep -Fq 'scripts\backup\60_create_backup.ps1' install.ps1
          grep -Fq 'scripts\backup\61_validate_backup.ps1' install.ps1
          grep -Fq 'scripts\backup\62_restore_plan.ps1' install.ps1
          grep -Fq 'wbadminVersionIdentifier' scripts/backup/60_create_backup.ps1
          grep -Fq 'wbadminVersionIdentifier' scripts/backup/61_validate_backup.ps1
          grep -Fq 'wbadminVersionIdentifier' scripts/backup/63_restore_drill.ps1
          grep -Fq "& \$RestorePointScript" scripts/backup/60_create_backup.ps1
          grep -Fq "minimumVersion='7.6.4'" scripts/backup/60_create_backup.ps1
          grep -Fq 'restorePointExitCode=$RestorePointExitCode' scripts/backup/60_create_backup.ps1

      - name: Validate Windows Terminal modern configuration contract
        shell: bash
        run: |
          set -euo pipefail
          profiles='config/windows-terminal/profiles.fragment.json'
          actions='config/windows-terminal/actions.json'
          settings='config/windows-terminal/settings.contract.json'
          starship='config/windows-terminal/starship.windows.toml'
          test -f "$profiles" && test -f "$actions" && test -f "$settings" && test -s "$starship"
          test ! -e config/wezterm/wezterm.lua
          test ! -e scripts/windows/31_wezterm.ps1

          jq -e '.profiles | length == 3' "$profiles" >/dev/null
          jq -e '.profiles[] | select(.name == "PowerShell 7 - DevOps") | (.commandline == "pwsh.exe -NoLogo" and .startingDirectory == "%USERPROFILE%" and .font.face == "JetBrainsMono Nerd Font, Segoe UI Emoji" and .font.builtinGlyphs == true and .font.colorGlyphs == true and .elevate == false and .suppressApplicationTitle == true and .colorScheme == "WPC DevOps")' "$profiles" >/dev/null
          jq -e '.profiles[] | select(.name == "PowerShell 7 - DevOps (Admin)") | (.commandline == "pwsh.exe -NoLogo" and .startingDirectory == "%USERPROFILE%" and .font.face == "JetBrainsMono Nerd Font, Segoe UI Emoji" and .font.builtinGlyphs == true and .font.colorGlyphs == true and .elevate == true and .suppressApplicationTitle == true and .colorScheme == "WPC DevOps Admin")' "$profiles" >/dev/null
          jq -e '.profiles[] | select(.name == "Ubuntu - DevOps") | (.commandline == "wsl.exe -d \"__WPC_DISTRIBUTION__\"" and .startingDirectory == "~" and .font.face == "JetBrainsMono Nerd Font, Segoe UI Emoji" and .font.builtinGlyphs == true and .font.colorGlyphs == true and .elevate == false and .suppressApplicationTitle == true and .colorScheme == "WPC Ubuntu")' "$profiles" >/dev/null

          jq -e '.actions | length == 7' "$actions" >/dev/null
          jq -e '.actions[] | select(.keys == "ctrl+t") | (.command.action == "newTab" and .command.profile == "PowerShell 7 - DevOps")' "$actions" >/dev/null
          jq -e '.actions[] | select(.keys == "ctrl+shift+3") | (.command.action == "newTab" and .command.profile == "PowerShell 7 - DevOps (Admin)" and .command.elevate == true)' "$actions" >/dev/null
          jq -e '.actions[] | select(.keys == "ctrl+shift+r") | (.command == "openTabRenamer")' "$actions" >/dev/null
          jq -e '.actions[] | select(.keys == "ctrl+w") | (.command.action == "closeTab")' "$actions" >/dev/null

          jq -e '(.globals.theme == "WPC DevOps") and (.globals.launchMode == "maximized") and (.globals.windowingBehavior == "useExisting") and (.globals.multiLinePasteWarning == true) and (.globals.largePasteWarning == true)' "$settings" >/dev/null
          jq -e '.themes[] | select(.name == "WPC DevOps") | (.window.applicationTheme == "dark" and .window.useMica == true)' "$settings" >/dev/null
          jq -e '([.schemes[].name] | sort) == (["WPC DevOps", "WPC DevOps Admin", "WPC Ubuntu"] | sort)' "$settings" >/dev/null
          jq -e '.newTabMenu | tostring | contains("Windows 11 Pro Custom") and contains("remainingProfiles")' "$settings" >/dev/null

          grep -qx 'add_newline = false' "$starship"
          grep -qx 'command_timeout = 1200' "$starship"
          grep -qx 'scan_timeout = 30' "$starship"
          grep -Fq '[env_var.WPC_ELEVATED]' "$starship"

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Reject mutable action references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^[[:space:]]*uses:[[:space:]]+[^[:space:]#]+@(v[0-9]+|main|master|latest)([[:space:]#]|$)' .github/workflows; then
            echo 'Every GitHub Action must be pinned to an immutable commit SHA.' >&2
            exit 1
          fi
      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          version='1.7.12'
          expected='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 120 -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" -o actionlint.tar.gz
          echo "${expected}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
      - name: Lint workflows
        run: actionlint .github/workflows/*.yml

  safety-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Reject destructive Windows operations
        shell: bash
        run: |
          set -euo pipefail
          forbidden='Format-Volume|Clear-Disk|Initialize-Disk|Remove-Partition|DisableRealtimeMonitoring.*true'
          if grep -RInE "$forbidden" scripts --include='*.ps1'; then
            echo 'A destructive or Defender-disabling command was detected in executable PowerShell.' >&2
            exit 1
          fi
      - name: Enforce optimization safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          profiles=(config/windows/optimization/*.json)
          forbidden_services='^(SharedAccess|StorSvc|wuauserv|WinDefend|mpssvc|vmcompute|hns)$'
          if jq -r '.services[]?.name' "${profiles[@]}" | grep -E "$forbidden_services"; then
            echo 'A forbidden Windows/WSL/security service is targeted by an optimization profile.' >&2
            exit 1
          fi
          if jq -r '.registry[]?.path' "${profiles[@]}" | grep -Ei 'Windows Defender|WindowsUpdate|WindowsFirewall'; then
            echo 'A forbidden security/update Registry path is targeted by an optimization profile.' >&2
            exit 1
          fi
          if [[ "$(jq '.services | length' config/windows/optimization/standard.json)" != '0' ]]; then
            echo 'The default standard optimization profile must not modify services.' >&2
            exit 1
          fi
          if grep -RInE 'Remove-AppxPackage|Disable-WindowsOptionalFeature|winget[[:space:]]+uninstall' scripts/windows/4*.ps1; then
            echo 'Optimization scripts must not remove Windows components or apps.' >&2
            exit 1
          fi
