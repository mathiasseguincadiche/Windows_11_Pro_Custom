name: Release canonical migration

on:
  push:
    branches: [release-1.0.0-unification]
    paths:
      - '.github/workflows/release-canonical-migration.yml'

permissions:
  contents: write

jobs:
  migrate-documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
        with:
          ref: release-1.0.0-unification
          fetch-depth: 0

      - name: Canonicalize active documentation
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [Path('README.md'), *sorted(Path('docs').glob('*.md'))]
          replacements = {
              '00_storage_identity_v25.ps1': '00_storage_identity.ps1',
              '00_storage_integrity_v24.ps1': '00_storage_integrity.ps1',
              '90_workstation_fingerprint_v26.ps1': '90_workstation_fingerprint.ps1',
              '63_restore_drill_v26.ps1': '63_restore_drill.ps1',
              '60_create_backup_v7.ps1': '60_create_backup.ps1',
              '61_validate_backup_v7.ps1': '61_validate_backup.ps1',
              '62_restore_plan_v7.ps1': '62_restore_plan.ps1',
              '11_validate_v3.ps1': '11_validate_windows.ps1',
              '12_validate_v4.ps1': '12_validate_optimization.ps1',
              '13_validate_hardware_v5.ps1': '13_validate_hardware.ps1',
              '14_validate_wsl_v6.ps1': '14_validate_wsl.ps1',
              '40_v4_optimize.ps1': '40_optimize.ps1',
              '53_responsiveness_v8.ps1': '53_responsiveness.ps1',
              'config/backup/v7-policy.json': 'config/backup/policy.json',
              'config/hardware/target-v5.json': 'config/hardware/target.json',
              'config/hardware/symbiosis-v5.json': 'config/hardware/symbiosis.json',
              'config/updates/v11.json': 'config/updates/policy.json',
              'config/windows/v4/': 'config/windows/optimization/',
              'config/windows/v8/responsiveness.json': 'config/windows/responsiveness.json',
              'reports/workstation-v26': 'reports/workstation',
              'reports\\workstation-v26': 'reports\\workstation',
              'validation-v7.json': 'validation.json',
              'restore-plan-v7.txt': 'restore-plan.txt',
              'Windows_11_Pro_Custom_Backup\\V7': 'Windows_11_Pro_Custom_Backup\\sessions',
              'Windows_11_Pro_Custom_Backup\V7': 'Windows_11_Pro_Custom_Backup\sessions',
              'SkipV4RestorePoint': 'SkipFoundationRestorePoint',
          }

          phrase_replacements = {
              'V25 STORAGE IDENTITY': 'STORAGE IDENTITY',
              'V25 LEGACY BASELINE ACTION REQUIRED': 'STORAGE IDENTITY BASELINE ACTION REQUIRED',
              'baseline V25': 'baseline d’identité stockage',
              'Baseline V25': 'Baseline d’identité stockage',
              'contrat V25': 'contrat d’identité stockage',
              'Contrat V25': 'Contrat d’identité stockage',
              'parcours V25': 'parcours d’identité stockage',
              'Parcours V25': 'Parcours d’identité stockage',
              'preuve V25': 'preuve d’identité stockage',
              'preuves V25': 'preuves d’identité stockage',
              'V25': 'identité stockage',
              'V26': 'preuves workstation',
              'V7': 'Golden Backup',
          }

          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              for old, new in phrase_replacements.items():
                  text = text.replace(old, new)
              # L'historique produit appartient au CHANGELOG, pas aux guides actifs.
              text = re.sub(r'\bV(?:3|4|5|6|8|9|10|11|12|13|18|19|20|21|22|23|24|27)\b', 'jalon historique', text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed documentation files:')
          for path in changed:
              print(f' - {path}')

          violations = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              for old in replacements:
                  if old in text:
                      violations.append(f'{path}: legacy path remains: {old}')
              if re.search(r'\bV\d+\b', text):
                  violations.append(f'{path}: Vxx label remains in active documentation')
          if violations:
              raise SystemExit('\n'.join(violations))

      - name: Commit canonical documentation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md docs; then
            echo 'No documentation migration required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs
          git commit -m 'docs: canoniser les références de la release 1.0.0'
          git push origin HEAD:release-1.0.0-unification
