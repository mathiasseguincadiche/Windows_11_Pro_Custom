name: Hardware symbiosis V5

on:
  pull_request:
    paths:
      - '.github/workflows/hardware-symbiosis-v5.yml'
      - 'install.ps1'
      - 'config/hardware/target-v5.json'
      - 'config/hardware/symbiosis-v5.json'
      - 'scripts/windows/52_hardware_symbiosis.ps1'
      - 'scripts/bootstrap/13_validate_hardware_v5.ps1'
      - 'docs/15_HARDWARE_QUALIFICATION_V5.md'
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/hardware-symbiosis-v5.yml'
      - 'install.ps1'
      - 'config/hardware/target-v5.json'
      - 'config/hardware/symbiosis-v5.json'
      - 'scripts/windows/52_hardware_symbiosis.ps1'
      - 'scripts/bootstrap/13_validate_hardware_v5.ps1'
      - 'docs/15_HARDWARE_QUALIFICATION_V5.md'
      - 'README.md'
      - 'CHANGELOG.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate hardware policy
        shell: bash
        run: |
          set -euo pipefail
          policy='config/hardware/symbiosis-v5.json'
          jq -e '
            (.version == "V5") and
            (.reviewedAt == "2026-08-12") and
            (.drivers.amdChipset.minimumApprovedVersion == "8.05.04.516") and
            (.drivers.intelArc.minimumApprovedVersion == "32.0.101.8864") and
            (.drivers.intelArc.requireResizableBarManualProof == true) and
            (.storage.minimumCount == 2) and
            (.storage.requireNvme == true) and
            (.storage.temperatureWarningC == 65) and
            (.storage.temperatureCriticalC == 70) and
            (.network.requireLanDevice == true) and
            (.network.requireWifiDevice == true) and
            (.network.mutateOffloads == false) and
            (.security.autoEnableHvci == false) and
            (.power.policy == "balanced") and
            (.power.allowUltimatePerformance == false) and
            (.bios.autoFlash == false)
          ' "$policy" >/dev/null

          jq -e '.symbiosisPolicy == "config/hardware/symbiosis-v5.json"' config/hardware/target-v5.json >/dev/null
          grep -Fq 'scripts\windows\52_hardware_symbiosis.ps1' scripts/bootstrap/13_validate_hardware_v5.ps1
          grep -Fq -- '-Mode Verify' scripts/bootstrap/13_validate_hardware_v5.ps1

      - name: Validate bootstrap wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '& "$RepoRoot\scripts\windows\50_hardware_inventory.ps1"' install.ps1
          grep -Fq '& "$RepoRoot\scripts\windows\52_hardware_symbiosis.ps1" -Mode Audit' install.ps1
          grep -Fq '& "$RepoRoot\scripts\bootstrap\13_validate_hardware_v5.ps1" -RequireManualChecks' install.ps1

          inventory_line="$(grep -nF '& "$RepoRoot\scripts\windows\50_hardware_inventory.ps1"' install.ps1 | head -n1 | cut -d: -f1)"
          symbiosis_line="$(grep -nF '& "$RepoRoot\scripts\windows\52_hardware_symbiosis.ps1" -Mode Audit' install.ps1 | head -n1 | cut -d: -f1)"
          trim_line="$(grep -nF '& "$RepoRoot\scripts\windows\21_storage_trim.ps1" -Mode Audit' install.ps1 | head -n1 | cut -d: -f1)"

          if (( symbiosis_line <= inventory_line || symbiosis_line >= trim_line )); then
            echo 'V5 symbiosis audit must run after inventory and before storage tuning audit.' >&2
            exit 1
          fi
          echo 'V5 bootstrap wiring: OK'

      - name: Enforce observational safety boundary
        shell: bash
        run: |
          set -euo pipefail
          script='scripts/windows/52_hardware_symbiosis.ps1'
          forbidden='Set-NetAdapter|Set-NetAdapterAdvancedProperty|Set-MpPreference|bcdedit|Set-Service|Stop-Service|Disable-WindowsOptionalFeature|Format-Volume|Clear-Disk|Initialize-Disk|Resize-Partition|Remove-Partition|Update-StorageFirmware|powercfg(.exe)?[[:space:]]+/(setactive|setacvalueindex|setdcvalueindex)'
          if grep -nEi "$forbidden" "$script"; then
            echo 'Hardware symbiosis V5 must remain observational and must not mutate platform tuning.' >&2
            exit 1
          fi
          grep -Fq "ValidateSet('Audit', 'Verify')" "$script"
          echo 'Hardware symbiosis safety boundary: OK'

  audit-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Execute non-mutating hardware audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\windows\52_hardware_symbiosis.ps1 -Mode Audit
      - name: Validate generated report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Get-Content -Raw .\reports\hardware\hardware-symbiosis-v5.json | ConvertFrom-Json
          if ($report.Version -ne 'V5') { throw 'Unexpected hardware symbiosis report version.' }
          if ($report.PolicyReviewedAt -ne '2026-08-12') { throw 'Hardware policy review date is missing.' }
          if ($null -eq $report.HardChecks) { throw 'HardChecks section is missing.' }
          if ($null -eq $report.Advisory) { throw 'Advisory section is missing.' }
