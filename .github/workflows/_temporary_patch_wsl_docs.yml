name: Temporary WSL docs patch

on:
  push:
    paths:
      - '.github/workflows/_temporary_patch_wsl_docs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
        with:
          ref: agent/post58-contract-cleanup

      - name: Apply exact WSL boundary wording
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/16_WSL2_GUIDE_COMPLET.md')
          text = path.read_text(encoding='utf-8')

          old_one = '''Évite d'utiliser comme racine quotidienne :

```text
/mnt/c/...
/mnt/e/...
```

Les montages `/mnt/c` et `/mnt/e` sont utiles pour **échanger** des fichiers avec Windows, mais les workloads Linux intensifs se comportent mieux sur ext4.'''
          new_one = '''Les montages Windows restent accessibles sous :

```text
/mnt/c/...
/mnt/e/...
```

`/mnt/c` et `/mnt/e` restent accessibles pour des échanges ponctuels avec Windows, mais sont **interdits comme racines de projets ou de workspaces DevOps**. Les projets Linux restent dans le filesystem ext4 de la distribution.'''

          old_two = '''Utilise ces chemins pour des échanges ponctuels, pas comme racine de projet Linux intensif.'''
          new_two = '''Utilise ces chemins uniquement pour des échanges ponctuels avec Windows : `/mnt/c` et `/mnt/e` sont **interdits comme racines de projets ou de workspaces DevOps**.'''

          if text.count(old_one) != 1:
              raise SystemExit(f'Bloc principal inattendu: {text.count(old_one)} occurrence(s)')
          if text.count(old_two) != 1:
              raise SystemExit(f'Bloc accès disques inattendu: {text.count(old_two)} occurrence(s)')

          text = text.replace(old_one, new_one).replace(old_two, new_two)
          path.write_text(text, encoding='utf-8')

      - name: Commit exact documentation patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- docs/16_WSL2_GUIDE_COMPLET.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/16_WSL2_GUIDE_COMPLET.md
          git commit -m 'docs(wsl): verrouiller la frontière des montages Windows'
          git push origin HEAD:agent/post58-contract-cleanup
