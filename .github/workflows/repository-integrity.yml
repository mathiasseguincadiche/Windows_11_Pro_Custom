name: Repository integrity

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'install.ps1'
      - 'menu.ps1'
      - 'update.ps1'
      - 'scripts/**'
      - 'config/**'
      - 'manifests/**'
      - 'tests/repository_integrity.py'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'install.ps1'
      - 'menu.ps1'
      - 'update.ps1'
      - 'scripts/**'
      - 'config/**'
      - 'manifests/**'
      - 'tests/repository_integrity.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Validate active paths and static repository dependencies
        shell: bash
        run: python3 tests/repository_integrity.py

  windows-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Parse corrected control-center and storage scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.\menu.ps1',
            '.\scripts\bootstrap\00_storage_integrity.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if (@($errors).Count -gt 0) {
              throw "$path parse errors: $($errors.Message -join '; ')"
            }
          }
