name: GitHub existing session UX contract

on:
  pull_request:
    paths:
      - 'scripts/bootstrap/16_external_auth_interactive.ps1'
      - '.github/workflows/github-auth-existing-session-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap/16_external_auth_interactive.ps1'
      - '.github/workflows/github-auth-existing-session-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned

      - name: Enforce explicit choice for an existing GitHub session
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Resolve-Path '.\scripts\bootstrap\16_external_auth_interactive.ps1'
          $tokens = $null
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if (@($errors).Count -gt 0) { throw "parse errors: $($errors.Message -join '; ')" }

          $fn = $ast.Find({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $n.Name -eq 'Configure-GitHub' }, $true)
          if (-not $fn) { throw 'Configure-GitHub missing.' }
          $text = $fn.Extent.Text

          foreach ($needle in @(
            '[DEJA OK] GitHub est déjà configuré.',
            'Compte/session : OK',
            'Stockage : fallback protégé 0600 déjà accepté',
            "Read-YesNoLoop -Prompt 'Veux-tu modifier/refaire la connexion GitHub'"
          )) {
            if (-not $text.Contains($needle)) { throw "Existing-session UX contract missing: $needle" }
          }

          $storageIndex = $text.IndexOf('Stockage : fallback protégé 0600 déjà accepté')
          $promptIndex = $text.IndexOf("Read-YesNoLoop -Prompt 'Veux-tu modifier/refaire la connexion GitHub'")
          if ($storageIndex -lt 0 -or $promptIndex -lt $storageIndex) {
            throw 'The explicit reconnect choice must be offered after the current GitHub state is displayed.'
          }

          $prePrompt = $text.Substring(0,$promptIndex)
          if ($prePrompt -match "PlaintextAccepted'[\s\S]{0,300}\breturn\b") {
            throw 'An accepted plaintext fallback must not bypass the user reconnect choice.'
          }
