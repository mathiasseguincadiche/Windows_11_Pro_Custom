name: Native Exit Code

on:
  pull_request:
    paths:
      - '.github/workflows/native-exitcode.yml'
      - 'scripts/core/native-process.psm1'
      - 'scripts/core/powershell-runtime.psm1'
      - 'scripts/bootstrap/**'
      - 'scripts/windows/**'
      - 'scripts/updates/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-exitcode.yml'
      - 'scripts/core/native-process.psm1'
      - 'scripts/core/powershell-runtime.psm1'
      - 'scripts/bootstrap/**'
      - 'scripts/windows/**'
      - 'scripts/updates/**'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Enforce StrictMode-safe native exit-code contract
        shell: bash
        run: |
          set -euo pipefail
          helper='scripts/core/native-process.psm1'
          test -f "$helper"
          grep -Fq 'Set-StrictMode -Version Latest' "$helper"
          # shellcheck disable=SC2016
          grep -Fq '$global:LASTEXITCODE = 0' "$helper"
          grep -Fq 'Get-Variable -Name LASTEXITCODE -ErrorAction SilentlyContinue' "$helper"
          # shellcheck disable=SC2016
          if grep -nE '\$exitCode[[:space:]]*=[^\n]*\$LASTEXITCODE' "$helper"; then
            echo 'Unsafe direct LASTEXITCODE dereference detected.' >&2
            exit 1
          fi

  windows-strictmode:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned

      - name: Validate PowerShell 7.6.5 runtime
        shell: pwsh
        run: |
          Import-Module .\scripts\core\powershell-runtime.psm1 -Force
          [void](Assert-WpcPowerShellRuntime -MinimumVersion ([version]'7.6.5') -RequireWindows -PassThru)

      - name: Parse helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\core\native-process.psm1'),
            [ref]$tokens,
            [ref]$errors
          )
          if (@($errors).Count -gt 0) { throw "native-process.psm1 parse errors: $($errors.Message -join '; ')" }

      - name: Reproduce fresh-session LASTEXITCODE absence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Import-Module .\scripts\core\native-process.psm1 -Force
          Remove-Variable -Name LASTEXITCODE -Scope Global -ErrorAction SilentlyContinue
          if (Get-Variable -Name LASTEXITCODE -Scope Global -ErrorAction SilentlyContinue) { throw 'Test precondition failed: LASTEXITCODE should be absent.' }

          $cmd = Get-WpcNativeApplication -Name 'cmd.exe'
          if (-not $cmd) { throw 'cmd.exe unavailable.' }
          $result = Invoke-WpcNativeCapture -FilePath $cmd.Source -ArgumentList @('/d','/c','<nul set /p =strictmode-ok')
          if ($result.ExitCode -ne 0 -or $result.Text.Trim() -ne 'strictmode-ok') {
            throw "Fresh-session native capture failed: exit=$($result.ExitCode) text=$($result.Text)"
          }

          $normalized = Get-Variable -Name LASTEXITCODE -Scope Global -ErrorAction SilentlyContinue
          if ($null -eq $normalized -or [int]$normalized.Value -ne 0) { throw 'Helper must leave global LASTEXITCODE initialized to 0.' }

      - name: Preserve nonzero native exit codes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Import-Module .\scripts\core\native-process.psm1 -Force
          Remove-Variable -Name LASTEXITCODE -Scope Global -ErrorAction SilentlyContinue
          $cmd = Get-WpcNativeApplication -Name 'cmd.exe'
          if (-not $cmd) { throw 'cmd.exe unavailable.' }
          $result = Invoke-WpcNativeCapture -FilePath $cmd.Source -ArgumentList @('/d', '/c', 'exit 7')
          if ($result.ExitCode -ne 7) { throw "Expected native exit code 7, got $($result.ExitCode)" }

      - name: Exercise WinGet WindowsApps alias with LASTEXITCODE absent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          Import-Module .\scripts\core\native-process.psm1 -Force
          Remove-Variable -Name LASTEXITCODE -Scope Global -ErrorAction SilentlyContinue
          $winget = Get-WpcNativeApplication -Name 'winget.exe'
          if (-not $winget) {
            Write-Warning 'winget.exe unavailable on hosted runner; generic fresh-session and nonzero-exit tests remain authoritative.'
            return
          }
          $result = Invoke-WpcNativeCapture -FilePath $winget.Source -ArgumentList @('--version') -SuppressErrorOutput
          if ($result.ExitCode -ne 0 -or [string]::IsNullOrWhiteSpace($result.Text)) { throw "WinGet capture failed: exit=$($result.ExitCode) text=$($result.Text)" }
