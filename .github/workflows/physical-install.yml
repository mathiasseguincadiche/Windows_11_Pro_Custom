name: Physical install

on:
  pull_request:
    paths:
      - '.github/workflows/physical-install.yml'
      - 'VERSION'
      - 'install.ps1'
      - 'scripts/bootstrap/00_preflight.ps1'
      - 'scripts/bootstrap/02_physical_readiness.ps1'
      - 'scripts/bootstrap/06_wsl.ps1'
      - 'scripts/bootstrap/08_devops.ps1'
      - 'scripts/core/windows-native.psm1'
      - 'scripts/core/native-process.psm1'
      - 'scripts/core/reboot-state.psm1'
      - 'config/hardware/**'
      - 'config/wsl/**'
      - 'manifests/winget/apps-core.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/physical-install.yml'
      - 'VERSION'
      - 'install.ps1'
      - 'scripts/bootstrap/00_preflight.ps1'
      - 'scripts/bootstrap/02_physical_readiness.ps1'
      - 'scripts/bootstrap/06_wsl.ps1'
      - 'scripts/bootstrap/08_devops.ps1'
      - 'scripts/core/windows-native.psm1'
      - 'scripts/core/native-process.psm1'
      - 'scripts/core/reboot-state.psm1'
      - 'config/hardware/**'
      - 'config/wsl/**'
      - 'manifests/winget/apps-core.json'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Enforce fail-before-mutation physical readiness
        shell: bash
        run: |
          set -euo pipefail
          install='install.ps1'
          preflight='scripts/bootstrap/00_preflight.ps1'
          readiness='scripts/bootstrap/02_physical_readiness.ps1'
          native='scripts/core/native-process.psm1'
          reboot='scripts/core/reboot-state.psm1'

          test -f "$readiness"
          test -f "$native"
          test -f "$reboot"
          grep -Fq '02_physical_readiness.ps1' "$preflight"
          grep -Fq 'StrictPhysicalReadiness' "$install"
          grep -Fq "if (\$Mode -in @('Apply','Verify'))" "$install"
          grep -Fq 'Ensure-HardwareManualEvidence' "$install"
          grep -Fq 'avant toute convergence' "$install"
          grep -Fq -- '-not $PlanOnly' "$install"

          grep -Fq 'PowerShell 7 supporté' "$readiness"
          grep -Fq '7.4.0' "$readiness"
          grep -Fq 'build -ge 22621' "$readiness"
          grep -Fq 'FEATURE_COMPATIBLE=' "$readiness"
          grep -Fq 'SUPPORTED_OS=' "$readiness"
          grep -Fq 'RECOMMENDED_OS=' "$readiness"
          grep -Fq "'24H2'=[datetime]'2026-10-13'" "$readiness"
          grep -Fq "'25H2'=[datetime]'2027-10-12'" "$readiness"
          grep -Fq 'Secure Boot actif' "$readiness"
          grep -Fq 'TPM prêt' "$readiness"
          grep -Fq 'Virtualisation firmware active' "$readiness"
          grep -Fq 'Espace WSL sur E:' "$readiness"
          grep -Fq 'Symbiose matérielle critique' "$readiness"
          grep -Fq 'Pilote à vérifier:' "$readiness"
          grep -Fq 'Installation non bloquée' "$readiness"
          grep -Fq 'Microsoft-Windows-Subsystem-Linux' "$readiness"
          grep -Fq 'VirtualMachinePlatform' "$readiness"
          grep -Fq 'Garde-fou point de restauration disponible' "$readiness"
          grep -Fq "Get-WpcNativeApplication -Name 'winget.exe'" "$readiness"
          grep -Fq 'sourceDistribution' "$readiness"
          grep -Fq 'VERDICT: PHYSICAL INSTALL READY' "$readiness"
          grep -Fq 'Corrige uniquement les prérequis bloquants puis relance' "$readiness"
          grep -Fq "les informations pilotes ne bloquent jamais l'installation" "$readiness"
          grep -Eq '\$pendingReboot[[:space:]]*=[[:space:]]*@\(Get-PendingRebootReasons\)' "$readiness"
          grep -Fq 'scripts\core\reboot-state.psm1' "$readiness"
          grep -Fq 'Get-WpcPendingRebootState' "$readiness"
          grep -Fq 'PendingFileRenameOperations non bloquant' "$readiness"
          grep -Fq 'Release=$release' "$readiness"
          grep -Fq 'SchemaVersion=2' "$readiness"
          grep -Fq 'CantActivateDocumentInPipeline' "$native"

          if grep -nE 'winget\.exe[^[:cntrl:]]*\|' "$readiness"; then
            echo 'Physical readiness must not pipe a WinGet App Execution Alias.' >&2
            exit 1
          fi

          forbidden='Format-Volume|Clear-Disk|Initialize-Disk|Remove-Partition|DisableRealtimeMonitoring|--unregister|Remove-AppxPackage'
          if grep -InE "$forbidden" "$readiness"; then
            echo 'Physical readiness must stay observation-only.' >&2
            exit 1
          fi

      - name: Enforce deterministic WSL and Docker first-run recovery
        shell: bash
        run: |
          set -euo pipefail
          contract='config/wsl/runtime-contract.json'
          wsl='scripts/bootstrap/06_wsl.ps1'
          devops='scripts/bootstrap/08_devops.ps1'

          jq -e '.sourceDistribution == "Ubuntu-26.04" and .distribution == "Ubuntu"' "$contract" >/dev/null
          grep -Fq -- '--distribution $sourceDistribution --name $Distribution --location $InstallLocation --no-launch' "$wsl"
          grep -Fq 'Aucune autre version Ubuntu ne sera substituée silencieusement' "$wsl"
          grep -Fq 'Restart-WslSessionAfterDockerGroupChange' "$devops"
          grep -Fq 'wsl.exe --terminate $Distribution' "$devops"
          grep -Fq -- "-Command 'id -nG'" "$devops"
          grep -Fq 'docker info >/dev/null 2>&1' "$devops"

  windows-host-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Parse physical installation PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.\install.ps1',
            '.\scripts\bootstrap\00_preflight.ps1',
            '.\scripts\bootstrap\02_physical_readiness.ps1',
            '.\scripts\bootstrap\06_wsl.ps1',
            '.\scripts\bootstrap\08_devops.ps1',
            '.\scripts\core\windows-native.psm1',
            '.\scripts\core\native-process.psm1',
            '.\scripts\core\reboot-state.psm1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw "$path parse errors: $($errors.Message -join '; ')" }
          }

      - name: Validate release and report schema contract
        shell: pwsh
        run: |
          $release = (Get-Content -Raw .\VERSION).Trim()
          if ($release -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release: $release" }
          $source = Get-Content -Raw .\scripts\bootstrap\02_physical_readiness.ps1
          foreach ($fragment in @('Release=$release','SchemaVersion=2')) {
            if (-not $source.Contains($fragment)) { throw "Readiness report contract missing: $fragment" }
          }

      - name: Validate PowerShell Core and native host detection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -ne 'Core') { throw "Expected PowerShell Core, got $($PSVersionTable.PSEdition)" }
          if ([version]$PSVersionTable.PSVersion -lt [version]'7.4.0') { throw "PowerShell runner too old: $($PSVersionTable.PSVersion)" }
          Import-Module .\scripts\core\windows-native.psm1 -Force
          if (-not (Test-WpcWindowsHost)) { throw 'Windows runner was not detected as Windows.' }
          $hadOS = Test-Path Env:OS
          $originalOS = $env:OS
          try {
            Remove-Item Env:OS -ErrorAction SilentlyContinue
            if (-not (Test-WpcWindowsHost)) { throw 'Detection failed without env:OS.' }
            $env:OS = 'CORRUPTED_FOR_PHYSICAL_INSTALL_TEST'
            if (-not (Test-WpcWindowsHost)) { throw 'Detection trusted corrupted env:OS.' }
          }
          finally {
            if ($hadOS) { $env:OS = $originalOS } else { Remove-Item Env:OS -ErrorAction SilentlyContinue }
          }

      - name: Prove StrictMode collection cardinality for reboot reasons
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          function Get-RebootReasonFixture {
            param([string[]]$Items)
            $reasons = [System.Collections.Generic.List[string]]::new()
            foreach ($item in @($Items)) { $reasons.Add($item) }
            return @($reasons)
          }
          foreach ($case in @(
            @{ Items = @(); Expected = 0 },
            @{ Items = @('CBS'); Expected = 1 },
            @{ Items = @('CBS','WindowsUpdate'); Expected = 2 }
          )) {
            $actual = @(Get-RebootReasonFixture -Items $case.Items)
            if ($actual.Count -ne $case.Expected) { throw "Cardinality mismatch: expected=$($case.Expected) actual=$($actual.Count)" }
          }
          $readiness = Get-Content -Raw .\scripts\bootstrap\02_physical_readiness.ps1
          if ($readiness -notmatch '\$pendingReboot\s*=\s*@\(Get-PendingRebootReasons\)') {
            throw 'Physical readiness must materialize blocking pending reboot reasons before using .Count.'
          }
          Import-Module .\scripts\core\reboot-state.psm1 -Force
          $liveState = Get-WpcPendingRebootState
          if ($liveState.Pending -isnot [bool]) { throw 'Shared reboot detector returned an invalid Pending type.' }

      - name: Validate Windows optional-feature inspection API
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Dism -ErrorAction Stop
          if (-not (Get-Command Get-WindowsOptionalFeature -ErrorAction SilentlyContinue)) {
            throw 'Get-WindowsOptionalFeature is unavailable after importing DISM.'
          }

      - name: Observe hosted-runner WSL CLI capabilities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\scripts\core\native-process.psm1 -Force
          $wsl = Get-WpcNativeApplication -Name 'wsl.exe'
          if (-not $wsl) { throw 'wsl.exe is unavailable on the hosted Windows runner.' }
          $result = Invoke-WpcNativeCapture -FilePath $wsl.Source -ArgumentList @('--help')
          Write-Host "Hosted runner wsl --help exit code = $($result.ExitCode)"
          foreach ($option in @('--location','--name','--no-launch')) {
            Write-Host "Hosted runner capability $option = $($result.Text -match [regex]::Escape($option))"
          }
