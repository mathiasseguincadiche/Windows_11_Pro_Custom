name: V9 log directory hotfix

on:
  push:
    branches: [feat/orchestration-idempotence-v9]
    paths:
      - '.github/workflows/v9-logdir-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/orchestration-idempotence-v9
          fetch-depth: 0
      - name: Ensure per-script log directories exist before first write
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/core/runtime.psm1')
          text = path.read_text(encoding='utf-8')
          needle = "    Add-Content -LiteralPath $logPath -Encoding UTF8 -Value ''\n"
          replacement = "    New-Item -ItemType Directory -Force -Path (Split-Path -Parent $logPath) | Out-Null\n" + needle
          count = text.count(needle)
          if count < 1:
              raise SystemExit('No log preamble write found')
          path.write_text(text.replace(needle, replacement), encoding='utf-8', newline='\n')
          print(f'Patched {count} log preamble write(s)')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/core/runtime.psm1
          git commit -m 'fix: create per-script log directories before writes'
          git push origin HEAD:feat/orchestration-idempotence-v9
