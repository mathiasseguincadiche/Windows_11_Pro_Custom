name: Windows native modules

on:
  pull_request:
    paths:
      - '.github/workflows/windows-native-modules.yml'
      - 'scripts/core/windows-native.psm1'
      - 'scripts/bootstrap/00_preflight.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-native-modules.yml'
      - 'scripts/core/windows-native.psm1'
      - 'scripts/bootstrap/00_preflight.ps1'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Enforce explicit Windows module bootstrap for pwsh
        shell: bash
        run: |
          set -euo pipefail
          module='scripts/core/windows-native.psm1'
          preflight='scripts/bootstrap/00_preflight.ps1'
          grep -Fq "System32\\WindowsPowerShell\\v1.0\\Modules" "$module"
          grep -Fq 'Add-WpcWindowsNativeModulePath' "$module"
          grep -Fq 'Get-WpcWindowsNativeModuleRoot' "$module"
          grep -Fq "ModuleName 'Storage'" "$module"
          grep -Fq "Get-Volume','Get-PhysicalDisk','Get-StorageReliabilityCounter" "$module"
          grep -Fq 'return [bool]$IsWindows' "$module"
          grep -Fq 'importés directement dans le processus PowerShell 7 courant' "$module"
          grep -Fq 'Initialize-WpcWindowsNativeModules -Profile Full' "$preflight"
          bootstrap_line="$(grep -nF 'Initialize-WpcWindowsNativeModules -Profile Full' "$preflight" | head -n1 | cut -d: -f1)"
          volume_line="$(grep -nF "\$volumes = Get-Volume" "$preflight" | head -n1 | cut -d: -f1)"
          if [[ -z "$bootstrap_line" || -z "$volume_line" || "$bootstrap_line" -ge "$volume_line" ]]; then
            echo 'Windows native modules must be initialized before the first Get-Volume call.' >&2
            exit 1
          fi

  non-windows-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Reject a non-Windows host using PowerShell 7 native platform fact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\scripts\core\windows-native.psm1 -Force
          if (Test-WpcWindowsHost) { throw 'Linux runner was incorrectly detected as Windows.' }

  windows-recovery:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Parse Windows native PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('.\scripts\core\windows-native.psm1', '.\scripts\bootstrap\00_preflight.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw "$path parse errors: $($errors.Message -join '; ')" }
          }

      - name: Prove Windows host detection is native to pwsh
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\scripts\core\windows-native.psm1 -Force
          if (-not (Test-WpcWindowsHost)) { throw 'Baseline Windows host detection failed.' }
          $originalOS = $env:OS
          try {
            Remove-Item Env:OS -ErrorAction SilentlyContinue
            if (-not (Test-WpcWindowsHost)) { throw 'Windows detection must rely on $IsWindows, not env:OS.' }
            $env:OS = 'BROKEN_OR_CUSTOM_VALUE'
            if (-not (Test-WpcWindowsHost)) { throw 'Windows detection incorrectly trusts env:OS.' }
          }
          finally {
            if ($null -ne $originalOS) { $env:OS = $originalOS } else { Remove-Item Env:OS -ErrorAction SilentlyContinue }
          }

      - name: Reproduce missing inbox Storage autoload and recover in pwsh
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\scripts\core\windows-native.psm1 -Force
          $nativeRoot = Get-WpcWindowsNativeModuleRoot
          if (-not (Test-Path -LiteralPath $nativeRoot)) { throw "Windows inbox module root missing on runner: $nativeRoot" }

          $original = $env:PSModulePath
          try {
            Remove-Module Storage -Force -ErrorAction SilentlyContinue
            $separator = [IO.Path]::PathSeparator
            $remaining = @(
              ([string]$env:PSModulePath -split [regex]::Escape([string]$separator)) |
                Where-Object { $_ -and -not [string]::Equals([IO.Path]::GetFullPath($_).TrimEnd('\'), [IO.Path]::GetFullPath($nativeRoot).TrimEnd('\'), [StringComparison]::OrdinalIgnoreCase) }
            )
            $env:PSModulePath = ($remaining -join $separator)

            $result = Import-WpcWindowsModule -ModuleName Storage -RequiredCommands @('Get-Volume','Get-PhysicalDisk','Get-StorageReliabilityCounter')
            if (-not $result.Available) { throw 'Storage module recovery did not report Available=true.' }
            foreach ($command in @('Get-Volume','Get-PhysicalDisk','Get-StorageReliabilityCounter')) {
              if (-not (Get-Command $command -ErrorAction SilentlyContinue)) { throw "$command unavailable after recovery." }
            }
            $paths = @(([string]$env:PSModulePath -split [regex]::Escape([string]$separator)) | Where-Object { $_ })
            $restored = @($paths | Where-Object { [string]::Equals([IO.Path]::GetFullPath($_).TrimEnd('\'), [IO.Path]::GetFullPath($nativeRoot).TrimEnd('\'), [StringComparison]::OrdinalIgnoreCase) }).Count -gt 0
            if (-not $restored) { throw 'Windows inbox module root was not restored into the process PSModulePath.' }
          }
          finally {
            $env:PSModulePath = $original
          }

      - name: Validate full discovery module set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\scripts\core\windows-native.psm1 -Force
          $results = @(Initialize-WpcWindowsNativeModules -Profile Full)
          $required = @('Storage','MMAgent','ScheduledTasks','Defender')
          foreach ($name in $required) {
            $entry = @($results | Where-Object Module -EQ $name)
            if ($entry.Count -ne 1 -or -not $entry[0].Available) { throw "Required Windows module unavailable in native bootstrap: $name" }
          }
