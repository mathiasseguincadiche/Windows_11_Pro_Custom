name: Physical foundation

on:
  pull_request:
    paths:
      - '.github/workflows/physical-foundation.yml'
      - 'VERSION'
      - 'install.ps1'
      - 'scripts/bootstrap/00_preflight.ps1'
      - 'scripts/bootstrap/02_physical_readiness.ps1'
      - 'scripts/bootstrap/02_foundation.ps1'
      - 'scripts/bootstrap/13_validate_hardware.ps1'
      - 'scripts/windows/41_restore_point.ps1'
      - 'scripts/core/native-process.psm1'
      - 'scripts/core/powershell-runtime.psm1'
      - 'config/powershell/runtime.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/physical-foundation.yml'
      - 'VERSION'
      - 'install.ps1'
      - 'scripts/bootstrap/00_preflight.ps1'
      - 'scripts/bootstrap/02_physical_readiness.ps1'
      - 'scripts/bootstrap/02_foundation.ps1'
      - 'scripts/bootstrap/13_validate_hardware.ps1'
      - 'scripts/windows/41_restore_point.ps1'
      - 'scripts/core/native-process.psm1'
      - 'scripts/core/powershell-runtime.psm1'
      - 'config/powershell/runtime.json'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Enforce staged physical bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          install='install.ps1'
          preflight='scripts/bootstrap/00_preflight.ps1'
          readiness='scripts/bootstrap/02_physical_readiness.ps1'
          foundation='scripts/bootstrap/02_foundation.ps1'
          restore='scripts/windows/41_restore_point.ps1'

          test -f "$foundation"
          grep -Fq 'RequireFoundation' "$preflight"
          grep -Fq -- '-RequireFoundation:$RequireFoundation' "$preflight"
          grep -Fq 'RequireFoundation' "$readiness"
          grep -Fq 'Release=$release' "$readiness"
          grep -Fq 'SchemaVersion=2' "$readiness"
          grep -Fq 'PowerShell 7.6.4+ Core x64' "$readiness"
          grep -Fq 'Matériel cible essentiel détecté' "$readiness"
          grep -Fq 'Affichage cible 1440p240' "$readiness"
          grep -Fq -- '-Blocking $false' "$readiness"
          grep -Fq '$foundationBlocking=[bool]$RequireFoundation' "$readiness"
          grep -Fq 'Microsoft-Windows-Subsystem-Linux' "$readiness"
          grep -Fq 'VirtualMachinePlatform' "$readiness"
          grep -Fq 'WinGet opérationnel' "$readiness"
          grep -Fq 'Runtime WSL Store opérationnel' "$readiness"
          grep -Fq 'READY FOR FOUNDATION BOOTSTRAP' "$readiness"
          grep -Fq 'Pilote à vérifier:' "$readiness"
          grep -Fq 'Installation non bloquée' "$readiness"

          grep -Fq '02_foundation.ps1' "$install"
          grep -Fq "Mode='Verify'" "$install"
          grep -Fq "Mode='Apply'" "$install"
          grep -Fq 'Point de restauration pré-fondations' "$install"
          grep -Fq 'Revalidation fondations Windows' "$install"
          grep -Fq 'RequireFoundation=[switch]::Present' "$install"
          grep -Fq -- '-not $PlanOnly' "$install"

          foundation_line=$(grep -n '02_foundation.ps1' "$install" | head -n1 | cut -d: -f1)
          machine_state_line=$(grep -n '01_machine_state.ps1' "$install" | head -n1 | cut -d: -f1)
          if [ "$foundation_line" -ge "$machine_state_line" ]; then
            echo 'Foundation bootstrap must occur before normal convergence discovery/plan.' >&2
            exit 1
          fi

          grep -Fq 'Assert-WpcPowerShellRuntime' "$foundation"
          grep -Fq "[version]'7.6.4'" "$foundation"
          grep -Fq 'Enable-WindowsOptionalFeature -Online -FeatureName' "$foundation"
          grep -Fq 'Microsoft-Windows-Subsystem-Linux' "$foundation"
          grep -Fq 'VirtualMachinePlatform' "$foundation"
          grep -Fq 'REDÉMARRAGE REQUIS' "$foundation"
          grep -Fq 'Repair-WpcWinGetPowerShell7' "$foundation"
          grep -Fq 'Microsoft.WinGet.Client' "$foundation"
          grep -Fq 'Install-PackageProvider -Name NuGet -Force -ForceBootstrap' "$foundation"
          grep -Fq 'Set-PSRepository -Name PSGallery -InstallationPolicy Trusted' "$foundation"
          grep -Fq 'Repair-WinGetPackageManager -Force -Latest' "$foundation"
          grep -Fq -- '--web-download' "$foundation"
          grep -Fq 'VERDICT: WINDOWS FOUNDATION READY - POWERSHELL 7 ONLY' "$foundation"

          grep -Fq "ClassName SystemRestore" "$readiness"
          grep -Fq "MethodName 'CreateRestorePoint'" "$restore"
          if grep -Fq 'Checkpoint-Computer' "$foundation" "$readiness" "$restore"; then
            echo 'Legacy restore-point runtime dependency detected.' >&2
            exit 1
          fi

          forbidden='Format-Volume|Clear-Disk|Initialize-Disk|Remove-Partition|DisableRealtimeMonitoring|--unregister|Remove-AppxPackage'
          if grep -InE "$forbidden" "$foundation"; then
            echo 'Foundation bootstrap contains a forbidden destructive operation.' >&2
            exit 1
          fi

      - name: Preserve final display qualification as advisory
        shell: bash
        run: |
          set -euo pipefail
          final='scripts/bootstrap/13_validate_hardware.ps1'
          grep -Fq '$advisoryChecks.Display1440p240' "$final"
          grep -Fq 'CurrentRefreshRate' "$final"
          grep -Fq 'non bloquant' "$final"
          grep -Fq 'Qualification matérielle critique échouée' "$final"
          if grep -Fq '$checks.Display1440p240' "$final"; then
            echo 'Display1440p240 must remain advisory and must not block FullInstall.' >&2
            exit 1
          fi

  windows-host-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pinned
      - name: Parse foundation PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            '.\install.ps1',
            '.\scripts\core\powershell-runtime.psm1',
            '.\scripts\bootstrap\00_preflight.ps1',
            '.\scripts\bootstrap\02_physical_readiness.ps1',
            '.\scripts\bootstrap\02_foundation.ps1',
            '.\scripts\bootstrap\13_validate_hardware.ps1',
            '.\scripts\windows\41_restore_point.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) { throw "$path parse errors: $($errors.Message -join '; ')" }
          }

      - name: Prove PowerShell 7 runtime and SystemRestore API
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module .\scripts\core\powershell-runtime.psm1 -Force
          [void](Assert-WpcPowerShellRuntime -MinimumVersion ([version]'7.6.4') -RequireWindows -PassThru)
          try {
            $class = Get-CimClass -Namespace 'root/default' -ClassName SystemRestore -ErrorAction Stop
          } catch {
            Write-Warning 'SystemRestore is not exposed by this hosted Windows Server runner; physical Windows 11 validation remains fail-closed.'
            return
          }
          $methods = @($class.CimClassMethods.Keys)
          foreach ($name in @('Enable','CreateRestorePoint')) {
            if ($methods -notcontains $name) { throw "SystemRestore.$name unavailable." }
          }

      - name: Prove optional-feature mutation API exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Dism -ErrorAction Stop
          foreach ($name in @('Get-WindowsOptionalFeature','Enable-WindowsOptionalFeature')) {
            if (-not (Get-Command $name -ErrorAction SilentlyContinue)) { throw "$name unavailable after DISM import." }
          }
